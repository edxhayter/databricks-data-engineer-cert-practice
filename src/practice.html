<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Databricks Data Engineer Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working column (question card) with a stats rail that drops below it on phones. Keyboard first. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --ink: #18212b; --muted: #5b6876; --line: #d9dfe5;
  --accent: #0e6a73; --accent-soft: #e1f0f1; --good: #1d7346; --good-soft: #e3f3ea;
  --bad: #b02a22; --bad-soft: #fbe7e5; --warn: #9a5b00; --warn-soft: #fbefdc;
  --soil: #8a6a4f; --seed: #7a5230; --leaf: #2f8a4e; --bud: #c98a12; --bloom: #c2417a;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --surface: #19212a; --ink: #e6ebf0; --muted: #9aa7b4; --line: #2b3641;
  --accent: #5cc3cb; --accent-soft: #163338; --good: #5fcf92; --good-soft: #15301f;
  --bad: #ff8a80; --bad-soft: #3a1b19; --warn: #f0b45a; --warn-soft: #382a14; --soil: #a88a6e; --seed: #c99a6a; --leaf: #5fcf92; --bud: #f0b45a; --bloom: #f08cb6; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19212a; --ink: #e6ebf0; --muted: #9aa7b4; --line: #2b3641;
  --accent: #5cc3cb; --accent-soft: #163338; --good: #5fcf92; --good-soft: #15301f;
  --bad: #ff8a80; --bad-soft: #3a1b19; --warn: #f0b45a; --warn-soft: #382a14; --soil: #a88a6e; --seed: #c99a6a; --leaf: #5fcf92; --bud: #f0b45a; --bloom: #f08cb6; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
h1 { font-family: var(--display); font-size: 26px; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 small { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: .04em; margin-left: 8px; }
.switches { display: flex; flex-wrap: wrap; gap: 8px; }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.modes button { border: 0; background: transparent; color: var(--muted); font: 600 13px var(--body); padding: 7px 14px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.modes.exam button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips[hidden] { display: none; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 11px; font: 500 13px var(--body); cursor: pointer; }
.chip .w { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 4px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.chip.missed[aria-pressed="true"] { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.tag { text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tag.repeat { background: var(--warn-soft); color: var(--warn); }
.q { font-size: 18px; line-height: 1.45; font-weight: 500; margin: 0 0 16px; }
code { font-family: var(--mono); font-size: .88em; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 10px 12px; font: 15px/1.45 var(--body); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible, .chip:focus-visible, .modes button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt .k { font-family: var(--mono); font-weight: 600; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; text-align: center; line-height: 22px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.feedback { overflow-wrap: anywhere; margin-top: 14px; border-left: 3px solid var(--line); padding: 8px 12px; background: var(--bg); border-radius: 0 6px 6px 0; }
.feedback.ok { border-color: var(--good); }
.feedback.no { border-color: var(--bad); }
.feedback strong { display: block; margin-bottom: 2px; }
.feedback a { color: var(--accent); font-size: 13px; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 6px; padding: 8px 16px; font: 600 14px var(--body); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { border-color: var(--bad); background: transparent; color: var(--bad); }
.hint { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.rail { display: flex; flex-direction: column; gap: 14px; }
.rail h2 { font-family: var(--display); font-size: 15px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi b { display: block; font-family: var(--mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.secs { display: flex; flex-direction: column; gap: 8px; }
.sec { display: grid; grid-template-columns: 26px minmax(0, 1fr) 64px; gap: 8px; align-items: center; font-size: 13px; }
.sec .n { font-family: var(--mono); color: var(--muted); }
.sec .v { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
.bar { height: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar i.lo { background: var(--bad); } .bar i.mid { background: var(--warn); } .bar i.hi { background: var(--good); }
.timer { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.timer.late { color: var(--bad); }
.dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
.dots button { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--muted); font: 11px var(--mono); cursor: pointer; padding: 0; }
.dots button.done { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.dots button.cur { outline: 2px solid var(--ink); }
.review { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.review .item { border-top: 1px solid var(--line); padding-top: 10px; }
.review .item p { margin: 4px 0; }
.small { font-size: 13px; color: var(--muted); }
textarea#copyfallback { width: 100%; height: 140px; font: 12px var(--mono); margin-top: 8px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
/* Garden: one plant per question; stage 0–5 grows with spaced correct answers. */
.plant { display: inline-block; vertical-align: middle; flex: none; }
.stage { display: inline-flex; align-items: center; gap: 4px; }
.growth { margin-top: 8px; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.growth .plant { width: 28px; height: 28px; }
.garden-head { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin: 4px 0 14px; }
.garden-head span { display: inline-flex; align-items: center; gap: 3px; }
.garden-head b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
.bed { margin-bottom: 16px; }
.bed h3 { font-family: var(--display); font-size: 15px; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.bed h3 small { font-family: var(--mono); font-weight: 400; font-size: 12px; color: var(--muted); }
.plot { display: flex; flex-wrap: wrap; gap: 2px; }
.plot button { border: 1px solid transparent; background: transparent; padding: 1px; border-radius: 4px; cursor: pointer; line-height: 0; }
.plot button:hover { border-color: var(--line); background: var(--bg); }
.plot button:focus-visible { outline: 2px solid var(--accent); }
.plot .plant { width: 22px; height: 22px; }
.stack { display: flex; height: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.stack i { display: block; height: 100%; }
.s1 { background: var(--seed); } .s2 { background: color-mix(in srgb, var(--leaf) 45%, var(--bg)); } .s3 { background: color-mix(in srgb, var(--leaf) 75%, var(--bg)); } .s4 { background: var(--bud); } .s5 { background: var(--bloom); }
@media (prefers-reduced-motion: no-preference) { .opt, .chip { transition: border-color .12s, background .12s; } }
</style>

<div class="wrap">
  <header>
    <h1><span id="title">Data Engineer Associate Practice</span> <small id="bankcount"></small></h1>
    <div class="switches">
      <div class="modes exam" role="group" aria-label="Exam">
        <button id="exam-assoc" aria-pressed="true">Associate</button>
        <button id="exam-pro" aria-pressed="false">Professional</button>
      </div>
      <div class="modes" role="group" aria-label="Mode">
        <button id="mode-drill" aria-pressed="true">Drill</button>
        <button id="mode-exam" aria-pressed="false">Timed mock</button>
        <button id="mode-garden" aria-pressed="false">Garden</button>
      </div>
    </div>
  </header>
  <div class="chips" id="chips" role="group" aria-label="Filter by section"></div>
  <div class="grid">
    <main class="card" id="main" aria-live="polite"></main>
    <aside class="rail">
      <section class="card">
        <h2>This session</h2>
        <div class="kpis">
          <div class="kpi"><b id="k-ans">0</b><span>answered</span></div>
          <div class="kpi"><b id="k-acc">–</b><span>correct</span></div>
          <div class="kpi"><b id="k-pace">–</b><span>sec per answer</span></div>
          <div class="kpi"><b id="k-due">0</b><span>misses to repeat</span></div>
          <div class="kpi"><b id="k-grew">0</b><span>plants grew</span></div>
          <div class="kpi"><b id="k-bloom">0</b><span>in bloom (all-time)</span></div>
        </div>
      </section>
      <section class="card">
        <h2>Garden by section</h2>
        <div class="secs" id="secs"></div>
      </section>
      <section class="card">
        <h2>Your misses</h2>
        <p class="small">Copy the list of questions you've missed and paste it to Claude for a targeted explanation.</p>
        <div class="actions" style="margin-top:8px">
          <button class="btn ghost" id="copy">Copy misses</button>
          <button class="btn danger" id="reset">Reset progress</button>
        </div>
        <div id="copyout"></div>
      </section>
    </aside>
  </div>
</div>

<script>
// Question bank. Format: [section, question, [correct, wrong, wrong, wrong], explanation, docKey, optionalCode]
// The correct option is always listed first here; the page shuffles option order on display.
const DOC = "https://docs.databricks.com/aws/en/";
const LINKS = {
  managed: DOC + "tables/managed",
  hist: DOC + "delta/history",
  ccfg: DOC + "compute/configure",
  cm: DOC + "compute/clusters-manage",
  wh: DOC + "compute/sql-warehouse/create",
  jc: DOC + "jobs/compute",
  copy: DOC + "sql/language-manual/delta-copy-into",
  als: DOC + "ingestion/cloud-object-storage/auto-loader/schema",
  alf: DOC + "ingestion/cloud-object-storage/auto-loader/file-detection-modes",
  alp: DOC + "ingestion/cloud-object-storage/auto-loader/production",
  scd: DOC + "ingestion/lakeflow-connect/scd",
  lfc: DOC + "ingestion/lakeflow-connect/",
  aqe: DOC + "optimizations/aqe",
  hints: DOC + "sql/language-manual/sql-ref-syntax-qry-select-hints",
  exp: DOC + "ldp/expectations",
  dlt: DOC + "ldp/concepts/where-is-dlt",
  ldp: DOC + "ldp/concepts/",
  mv: DOC + "sql/language-manual/sql-ref-syntax-ddl-create-materialized-view",
  join: DOC + "sql/language-manual/sql-ref-syntax-qry-select-join",
  pyspark: "https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/dataframe.html",
  pyfn: "https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/functions.html",
  runif: DOC + "jobs/run-if",
  cfg: DOC + "jobs/configure-job",
  foreach: DOC + "jobs/for-each",
  trig: DOC + "jobs/triggers",
  tut: DOC + "jobs/trigger-table-update",
  fat: DOC + "jobs/file-arrival-triggers",
  cf: DOC + "jobs/control-flow",
  bset: DOC + "dev-tools/bundles/settings",
  bvar: DOC + "dev-tools/bundles/variables",
  bdm: DOC + "dev-tools/bundles/deployment-modes",
  bun: DOC + "dev-tools/bundles/",
  lc: DOC + "delta/clustering",
  po: DOC + "optimizations/predictive-optimization",
  perm: DOC + "data-governance/unity-catalog/access-control/permissions-concepts",
  deny: DOC + "sql/language-manual/security-deny",
  undrop: DOC + "sql/language-manual/sql-ref-syntax-ddl-undrop-table",
  conv: DOC + "tables/convert-external-managed",
  abac: DOC + "data-governance/unity-catalog/abac/",
  fm: DOC + "data-governance/unity-catalog/filters-and-masks/",
  git: DOC + "repos/",
};

const BANK = [
// ---------- S1 Platform ----------
[1, "An engineer runs `CREATE TABLE main.sales.orders (id INT, amount DOUBLE)` with no `LOCATION` and no `USING` clause. What is created?",
 ["A Unity Catalog managed Delta table", "A Unity Catalog external Delta table in the workspace root", "A managed Iceberg table", "A Hive metastore Parquet table"],
 "With no LOCATION and no USING, the default is a UC managed table in Delta format. Iceberg needs an explicit USING iceberg.", "managed"],
[1, "With default table properties, how old must unreferenced data files be before `VACUUM` deletes them?",
 ["7 days", "30 days", "24 hours", "90 days"],
 "delta.deletedFileRetentionDuration defaults to 7 days. delta.logRetentionDuration (history) defaults to 30 days.", "hist"],
[1, "What is the default value of `delta.logRetentionDuration`?",
 ["30 days", "7 days", "14 days", "365 days"],
 "Table history is kept for 30 days by default. Data files are kept for 7 days (deletedFileRetentionDuration), so practical time travel is about 7 days.", "hist"],
[1, "A team needs to time travel 60 days back on a Delta table. What must they change?",
 ["Raise both delta.logRetentionDuration and delta.deletedFileRetentionDuration to at least 60 days", "Raise only delta.logRetentionDuration to 60 days", "Raise only delta.deletedFileRetentionDuration to 60 days", "Nothing, because time travel is unlimited by default"],
 "Time travel needs both the log entries and the data files for that version, so both retention settings must cover the window.", "hist"],
[1, "`RESTORE TABLE t TO VERSION AS OF 3` fails, saying data files are missing. What is the most likely cause?",
 ["VACUUM has already removed the data files that version 3 needs", "RESTORE only works on external tables", "RESTORE needs the table to be partitioned", "Version numbers start at 10"],
 "RESTORE fails if VACUUM has deleted the files a version depends on. RESTORE also needs MODIFY on the table.", "hist"],
[1, "Which compute access mode does Databricks recommend for most workloads, unless you need a feature it doesn't support?",
 ["Standard", "Dedicated", "No isolation shared", "Custom"],
 "Standard (formerly Shared) is recommended. Dedicated (formerly Single user) is for ML runtimes, GPUs, R, or features Standard doesn't support.", "ccfg"],
[1, "A new serverless SQL warehouse is created with default settings. When does it auto stop?",
 ["After 10 minutes idle", "After 45 minutes idle", "After 120 minutes idle", "Never"],
 "Serverless warehouses default to 10 minutes. Pro and classic default to 45 minutes.", "wh"],
[1, "A new Pro SQL warehouse is created with default settings. When does it auto stop?",
 ["After 45 minutes idle", "After 10 minutes idle", "After 5 minutes idle", "Never"],
 "Pro and classic warehouses default to 45 minutes (minimum 10). Serverless defaults to 10.", "wh"],
[1, "Which statement about job compute is correct?",
 ["It is created for the job run, terminates when the job ends, and can't be restarted", "It stays running between scheduled runs", "It can be shared interactively by notebook users", "It is the same as an all-purpose cluster with a job attached"],
 "Job compute exists only for the run. All-purpose compute is for interactive work and isn't recommended for production jobs.", "cm"],
[1, "On a compute resource running a current Databricks Runtime, Photon is:",
 ["On by default (DBR 9.1 LTS and above)", "Off until enabled by an admin", "Only available on SQL warehouses", "Only available for Python UDFs"],
 "Photon is enabled by default on DBR 9.1 LTS and above.", "ccfg"],

// ---------- S2 Ingestion ----------
[2, "An Auto Loader stream has no rate-limit options. 40,000 new files are waiting. How many files does each micro-batch process?",
 ["At most 1,000", "All 40,000 in one batch", "At most 10,000", "At most 100"],
 "cloudFiles.maxFilesPerTrigger defaults to 1,000. It is a hard limit; maxBytesPerTrigger is a soft limit.", "alp"],
[2, "Both `cloudFiles.maxFilesPerTrigger` and `cloudFiles.maxBytesPerTrigger` are set. Which statement is correct?",
 ["The file limit is hard, the byte limit is soft, and the batch stops at whichever limit is reached first", "The byte limit is hard and the file limit is soft", "Only the last option set is applied", "Setting both causes an error"],
 "The docs say the file limit is a hard limit but the byte limit is a soft limit. A batch may exceed maxBytesPerTrigger.", "alp"],
[2, "Auto Loader infers the schema (no `.schema()` call). Which schema evolution mode is used by default?",
 ["addNewColumns", "none", "rescue", "failOnNewColumns"],
 "Without a provided schema, the default is addNewColumns. With .schema(), the default is none.", "als"],
[2, "An Auto Loader stream is given an explicit schema with `.schema(...)`. What is the default schema evolution mode?",
 ["none", "addNewColumns", "rescue", "failOnNewColumns"],
 "With a provided schema the default is none: new columns are ignored. addNewColumns isn't allowed with .schema().", "als"],
[2, "An Auto Loader stream uses the default mode with an inferred schema. A file arrives with a brand-new column. What happens?",
 ["The stream stops with an UnknownFieldException; on restart it picks up the updated schema", "The new column is silently ignored", "The new column's values go to _rescued_data and the stream continues", "The stream fails permanently until the table is recreated"],
 "addNewColumns stops the stream, updates the schema, and the restart includes the column. Run it in a Lakeflow Job with retries.", "als"],
[2, "Default evolution mode, inferred schema. A column inferred as INT later receives the value 'N/A'. What happens?",
 ["The column stays INT and the value goes to _rescued_data", "The column changes to STRING", "The stream stops and widens the type on restart", "The row is dropped silently"],
 "In addNewColumns, existing columns don't change type. Type mismatches go to the rescued data column.", "als"],
[2, "Which mode lets Auto Loader widen an INT column to BIGINT when larger values arrive?",
 ["addNewColumnsWithTypeWidening", "addNewColumns", "rescue", "none"],
 "addNewColumnsWithTypeWidening (Public Preview, DBR 16.4+) widens supported types. Plain addNewColumns never changes existing types.", "als"],
[2, "The inferred schema has a column `userId`. A file contains `UserID`. With default settings, where does that value end up?",
 ["In _rescued_data", "In the userId column", "In a new UserID column", "It causes the stream to fail"],
 "Case mismatches are one of the things the rescued data column catches, along with type mismatches and fields missing from the schema.", "als"],
[2, "What does Auto Loader's `_rescued_data` column contain?",
 ["Data that couldn't be parsed into the schema, stored as JSON with the source file path", "A copy of every raw row", "Only rows that failed expectations", "The checkpoint offsets"],
 "Rescued values are stored as a JSON blob along with the path of the source file.", "als"],
[2, "Auto Loader reads JSON files with schema inference and no other options. What type are the inferred columns?",
 ["STRING", "The type seen in the first file", "VARIANT", "The widest numeric type"],
 "For JSON, CSV and XML, columns are inferred as STRING unless cloudFiles.inferColumnTypes is true (or you use schema hints).", "als"],
[2, "By default, how much data does Auto Loader sample for schema inference?",
 ["The first 50 GB or 1,000 files, whichever comes first", "The first file only", "The first 10 GB or 100 files", "Every file in the directory"],
 "The default sample is 50 GB or 1,000 files, whichever limit is hit first.", "als"],
[2, "An engineer wants Auto Loader to keep inferring the schema but force `amount` to DECIMAL(10,2). What should they use?",
 ["cloudFiles.schemaHints", "A full .schema() definition", "cloudFiles.schemaEvolutionMode = rescue", "COPY_OPTIONS ('mergeSchema' = 'true')"],
 "Schema hints override the inferred type for named columns. They apply only when you don't pass .schema().", "als"],
[2, "An engineer provides `.schema(...)` and sets `schemaEvolutionMode` to `addNewColumns`. What happens?",
 ["It isn't allowed; to evolve, use schema hints instead of a full schema", "New columns are added to the provided schema", "The provided schema is ignored", "The stream switches to rescue mode"],
 "addNewColumns isn't supported with a provided schema. Pass the known types as schemaHints instead.", "als"],
[2, "Which schema evolution mode never changes the schema and never fails on new columns, sending unexpected data to the rescued data column?",
 ["rescue", "none", "failOnNewColumns", "addNewColumns"],
 "rescue keeps the schema fixed and puts new data into _rescued_data. none ignores new columns (unless rescuedDataColumn is set).", "als"],
[2, "Which schema evolution mode fails the stream on a new column and keeps failing until the schema is updated by hand?",
 ["failOnNewColumns", "addNewColumns", "rescue", "none"],
 "failOnNewColumns doesn't restart successfully until someone changes the schema or removes the offending file.", "als"],
[2, "An Auto Loader stream has no file detection settings. Which mode does it use?",
 ["Directory listing", "File notification", "File events", "Polling the checkpoint"],
 "Directory listing is the default. File notification is recommended for most workloads.", "alf"],
[2, "Which file detection approach does Databricks recommend for most Auto Loader workloads?",

[2, "A source system occasionally emits a TRUNCATE event. The team wants to use `APPLY AS TRUNCATE WHEN` in an AUTO CDC flow that keeps full history. What happens?", ["It is not possible, because truncate is supported only for SCD type 1", "It works, and closes every open row by setting `__END_AT`", "It works, but only when `IGNORE NULL UPDATES` is also set", "It is not possible, because truncate needs `APPLY AS DELETE WHEN` first"], "`APPLY AS TRUNCATE WHEN` is supported only for SCD type 1; SCD type 2 does not support the truncate operation.", "https://docs.databricks.com/aws/en/ldp/developer/ldp-sql-ref-apply-changes-into"],
[2, "An SCD type 2 target built with `dp.create_auto_cdc_flow()` grows quickly because `last_login` changes constantly. The team wants new versions only when other columns change. What should they set?", ["`track_history_except_column_list=['last_login']`", "`except_column_list=['last_login']`", "`ignore_null_updates=True`", "`stored_as_scd_type='1'` for `last_login` only"], "By default SCD type 2 creates a new version when any column changes. `track_history_except_column_list` (or `TRACK HISTORY ON * EXCEPT` in SQL) excludes columns from history tracking while keeping them in the table.", "https://docs.databricks.com/aws/en/ldp/developer/ldp-python-ref-apply-changes"],
[2, "A team wants external Iceberg v3 clients to read streaming tables produced by a Lakeflow pipeline. Which statement is correct?", ["Set Iceberg properties such as `delta.universalFormat.enabledFormats = 'iceberg'` and enable external metadata; external writes are not supported", "Recreate the streaming tables `USING ICEBERG`; external clients can then read and write them", "Enable change data feed on each table; Iceberg clients read the feed as snapshots", "Publish the tables through a share; Iceberg clients cannot read pipeline datasets otherwise"], "External access for pipeline datasets uses table properties including column mapping, `delta.universalFormat.enabledFormats = 'iceberg'` and `delta.enableIcebergCompatV3`, plus `pipelines.externalMetadata.enabled`. External writes to pipeline datasets are not supported.", "https://docs.databricks.com/aws/en/external-access/external-for-pipelines"],
[2, "A SQL Server source has some tables with primary keys and some without. Lakeflow Connect will ingest all of them with minimal source load. Which change tracking setup matches Databricks guidance?", ["Change tracking for tables with primary keys, and CDC for tables without", "CDC for all tables, because change tracking cannot be used with Lakeflow Connect", "Change tracking for all tables, because it adds keys when none exist", "CDC for tables with primary keys, and change tracking for tables without"], "Change tracking is lightweight but requires a primary key; CDC does not need one but adds more load. Databricks recommends change tracking for any table with a primary key.", "https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/sql-server-source-setup"],

[2, "A DBA prepares a MySQL instance for the Lakeflow Connect MySQL connector. Which binary log configuration is required?", ["Binary logging on, format `ROW`, row image `FULL`", "Binary logging on, format `MIXED`, row image `MINIMAL`", "Binary logging on, format `STATEMENT`, row image `FULL`", "Binary logging on, format `ROW`, value options `PARTIAL_JSON`"], "The connector needs binary logging enabled, `ROW` format and `FULL` row image, with `binlog_row_value_options` left empty; `PARTIAL_JSON` is not supported.", "https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/mysql-source-setup"],
[2, "A team reviews costs for a Lakeflow Connect database connector (standard gateway setup). Which statement about compute is correct?", ["The ingestion gateway runs continuously on classic compute; the ingestion pipeline runs on serverless", "The ingestion gateway and ingestion pipeline both run on serverless compute", "The ingestion gateway runs on serverless; the ingestion pipeline runs on classic compute", "The ingestion gateway runs only when the ingestion pipeline is triggered"], "The gateway runs continuously on classic compute to capture changes before logs are truncated, and you pay for it even when the pipeline is idle. The ingestion pipeline runs on serverless compute.", "https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/cdc-overview"],
[2, "A Lakeflow Connect pipeline must keep prior versions of changed source rows. What is the default, and how is history enabled?", ["Default is SCD type 1; set `scd_type: SCD_TYPE_2` in `table_configuration`", "Default is SCD type 2; set `scd_type: SCD_TYPE_1` to turn history off", "Default is SCD type 1; add an AUTO CDC flow on top of the destination", "Default is append-only; set `history: true` on the ingestion gateway"], "By default history tracking is off (SCD type 1). Set `scd_type` to `SCD_TYPE_2` in `table_configuration`, or turn History tracking on in the UI.", "https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/scd"],

[2, "A provider creates an open (bearer token) recipient for a partner who does not use Databricks. Which statement is correct?", ["The credential file can be downloaded only once, and the token is valid for at most one year", "The credential file can be downloaded many times, and the token never expires by default", "The partner signs in with a Databricks account, and no token is issued", "The partner receives a sharing identifier and mounts the share as a catalog"], "Databricks-to-Open bearer token recipients get a credential file that can be downloaded only once, and tokens are valid for a maximum of one year. Rotation issues a new token and activation URL.", "https://docs.databricks.com/aws/en/opensharing/create-recipient-token"],
[2, "A Databricks recipient wants to query the change data feed of a shared table with `table_changes()`. What must the provider do?", ["Enable change data feed on the table, then add it to the share `WITH HISTORY`", "Add the table to the share `WITHOUT HISTORY` and grant `MODIFY` to the recipient", "Add the table with a `PARTITION` clause and grant `SELECT` on the table", "Enable change data feed on the share, then grant `USE SHARE` to the recipient"], "To let recipients use `table_changes()`, enable CDF on the table before sharing it `WITH HISTORY`. History sharing also allows time travel and streaming reads.", "https://docs.databricks.com/aws/en/opensharing/create-share"],
[2, "In a clean room, collaborator A uploads a notebook and names collaborator B as the runner. Collaborators B and C have not reviewed it. What must happen before it runs?", ["B and C must approve it, then only B can run it", "Only A must approve it, then any collaborator can run it", "B must approve it, then A or B can run it", "A, B and C must approve it, then only A can run it"], "Every notebook needs approval from all collaborators except the uploader, and only the designated runner can run it. A runner who did not upload it must approve it first.", "https://docs.databricks.com/aws/en/clean-rooms/clean-room-notebook"],
[2, "A clean room notebook writes output tables. Which statement about them is correct?", ["They are read-only, stored for 30 days, and readable by default only by the runner", "They are writable, stored for 90 days, and readable by all collaborators", "They are read-only, stored until the clean room is deleted, and readable by all", "They are writable, stored for 7 days, and readable by metastore admins only"], "Output tables are temporary read-only tables in the runner's metastore, stored for 30 days. By default only the principal that ran the notebook can read them; copy them to keep them longer.", "https://docs.databricks.com/aws/en/clean-rooms/output-tables"],
[2, "A user must create a foreign catalog on an existing PostgreSQL connection owned by another team. Which privileges are needed?", ["`CREATE CATALOG` on the metastore, plus `CREATE FOREIGN CATALOG` on the connection", "`CREATE CONNECTION` on the metastore, plus `USE CONNECTION` on the connection", "`CREATE CATALOG` on the metastore, plus `USE CONNECTION` on the connection", "`CREATE FOREIGN CATALOG` on the metastore, plus `SELECT` on the connection"], "Creating a foreign catalog needs `CREATE CATALOG` on the metastore and either ownership of the connection or `CREATE FOREIGN CATALOG` on it. Credentials come from the named connection.", "https://docs.databricks.com/aws/en/query-federation/database-federation"],
[2, "Finance runs daily dashboards over about 2 TB of data in a production SQL Server database and occasionally needs ad hoc lookups against the live source. Which approach follows Databricks guidance for the dashboards?", ["Ingest the data with a Lakeflow Connect managed connector, and keep query federation for the ad hoc lookups", "Query a foreign catalog through Lakehouse Federation, since filters are pushed down to SQL Server", "Query a foreign catalog and enable the disk cache so repeated dashboard reads come from worker SSDs", "Create a foreign catalog and write the dashboard aggregates back to SQL Server through it each night"], "Databricks recommends Lakeflow Connect managed connectors for high data volumes and lower query latency, and federation for ad hoc reporting or proof-of-concept work. Federated queries are read-only, and the result cache and disk cache don't apply to them.", "https://docs.databricks.com/aws/en/query-federation/database-federation"],
[2, "An admin creates a PostgreSQL connection for Lakehouse Federation and wants to avoid plaintext credentials and limit what users can do. Which statement is correct?", ["Use `secret()` for `user` and `password` in the connection; `MODIFY` cannot be granted on foreign tables", "Store `user` and `password` on each foreign catalog; `MODIFY` lets users write back to PostgreSQL", "Pass credentials per query with `remote_query`; foreign tables accept `MODIFY` grants", "Store credentials in a storage credential; foreign tables inherit `MODIFY` from the catalog"], "The connection holds the credentials, and Databricks recommends secrets such as `secret('<scope>','<key>')`. Foreign tables are read-only, so `MODIFY` cannot be granted on them.", "https://docs.databricks.com/aws/en/query-federation/postgresql"],

[7, "A data steward is not the owner of table `sales.core.orders`. Which privileges let them add a tag to it?", ["`APPLY TAG` on the table, `USE SCHEMA` on `core`, `USE CATALOG` on `sales`", "`MODIFY` on the table, `USE SCHEMA` on `core`, `USE CATALOG` on `sales`", "`APPLY TAG` on the table only, without any parent privileges", "`MANAGE` on the metastore, which inherits to all tables"], "Tagging needs ownership, or `APPLY TAG` on the object plus `USE SCHEMA` and `USE CATALOG` on its parents. Governed tags also need `ASSIGN` on the tag.", "https://docs.databricks.com/aws/en/database-objects/tags"],
[7, "A user with `APPLY TAG`, `USE SCHEMA` and `USE CATALOG` can set ordinary tags but fails when assigning the governed tag `data_class`. What is missing?", ["The `ASSIGN` permission on the governed tag", "The `MODIFY` privilege on the table", "Ownership of the parent schema", "The `MANAGE` privilege on the catalog"], "Governed tags can be assigned only by principals with the right permissions; besides tagging privileges, they need `ASSIGN` on that tag, and values must follow the tag policy.", "https://docs.databricks.com/aws/en/database-objects/tags"],
[7, "An engineer tries to tag three columns with `pii` in one `ALTER TABLE` statement. What happens?", ["It is not allowed; each column must be tagged with a separate statement", "It works if the columns are listed in one `ALTER COLUMN` clause", "It works only for governed tags, not ordinary tags", "It works, but the tag is stored at table level, not column level"], "You cannot assign tags to multiple columns in a single `ALTER TABLE` command, unlike `COMMENT`. Each object can hold at most 50 tags.", "https://docs.databricks.com/aws/en/database-objects/tags"],
[7, "An auditor needs a SQL list of every column tagged `pii` in a catalog. Where should they look?", ["The `COLUMN_TAGS` view in the catalog's `INFORMATION_SCHEMA`", "The `TABLE_TAGS` view in the catalog's `INFORMATION_SCHEMA`", "The output of `DESCRIBE HISTORY` on each table", "The `system.access.audit` table filtered on tag events"], "Each catalog's `INFORMATION_SCHEMA` exposes `CATALOG_TAGS`, `SCHEMA_TAGS`, `TABLE_TAGS`, `COLUMN_TAGS` and `VOLUME_TAGS`.", "https://docs.databricks.com/aws/en/database-objects/tags"],
[7, "A user with `MODIFY` on a table wants to remove its existing comment. Which statement does this?", ["`COMMENT ON TABLE my_table IS NULL;`", "`COMMENT ON TABLE my_table DROP;`", "`ALTER TABLE my_table UNSET COMMENT;`", "`COMMENT ON TABLE my_table REMOVE;`"], "`COMMENT ON` with `NULL` removes any existing comment. For tables, `MODIFY` is enough; for views you must be the owner.", "https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-comment"],

[7, "An admin wants one grant that lets an auditor see metadata for every object in the metastore, now and in future. Which metastore-level privilege inherits that way?", ["`READ METADATA`, the exception to the rule that metastore grants do not inherit", "`BROWSE`, because all metastore-level privileges inherit to every catalog", "`USE CATALOG`, because metastore grants inherit only to catalogs", "`CREATE CATALOG`, because creation rights imply read rights on children"], "Privileges granted on a metastore do not inherit to child objects, except `READ METADATA`, which inherits to all objects. Grants on a catalog or schema do inherit to current and future children.", "https://docs.databricks.com/aws/en/data-governance/unity-catalog/manage-privileges/privileges"],
[7, "A platform lead holds `MANAGE` on catalog `finance` but does not own it, and gets an error running `SELECT` on a table inside it. Why?", ["`MANAGE` covers privileges and ownership, but data access such as `SELECT` must be granted explicitly", "`MANAGE` on a catalog does not reach child tables, so it must be granted per table", "`MANAGE` includes `SELECT`, so the error means `USE SCHEMA` was revoked", "`MANAGE` is part of `ALL PRIVILEGES`, which must also be granted on the catalog"], "`MANAGE` lets a principal manage privileges, transfer ownership and drop objects, and applies to children, but holders must grant themselves data privileges like `SELECT`. `ALL PRIVILEGES` excludes `MANAGE`.", "https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/permissions-concepts"],

[4, "A streaming task in a job has a streaming backlog notification threshold set. When are notifications sent?", ["When the average backlog over 10 minutes exceeds the threshold, then every 30 minutes while it stays high", "When any single micro-batch exceeds the threshold, then once for every micro-batch over it", "When the backlog stays over the threshold for one hour, then once per day while it stays high", "When the backlog exceeds the threshold at task start, then once more when the task completes"], "Backlog notifications fire when the 10-minute average exceeds the threshold, and Databricks waits 30 minutes before sending another. Pipeline tasks don't support them.", "https://docs.databricks.com/aws/en/jobs/notifications"],
[8, "In the Spark UI stage page, Summary Metrics show a task duration 75th percentile of 40 seconds and a Max of 4 minutes. According to Databricks guidance, what does this suggest and what is a valid fix?", ["Likely skew; salt the skewed key or tune the AQE skew join thresholds", "Likely spill; set shuffle partitions to a fixed value of 10,000", "Likely small files; run VACUUM on the source table before the job", "Likely an overloaded driver; move to a larger driver node type"], "If Max exceeds the 75th percentile by 50% or more, the stage might have skew. Fixes include AQE skew settings, salting keys, liquid clustering or the `REBALANCE` hint.", "https://docs.databricks.com/aws/en/optimizations/spark-ui-guide/long-spark-stage-page"],
[8, "The Spark UI jobs timeline shows gaps of several minutes in the middle of a pipeline with no Spark jobs running. Cluster Metrics show a red block on the driver in Server load distribution while workers are blue. What is the likely cause?", ["Driver-side work outside Spark, or an overloaded driver", "Data skew concentrated in the pipeline's longest stage", "Executors spilling shuffle data to local disk", "Autoscaling removing idle executors from the cluster"], "Gaps mid-pipeline often come from non-Spark code or complex plans on the driver; a red driver block with blue workers indicates an overloaded driver.", "https://docs.databricks.com/aws/en/optimizations/spark-ui-guide/spark-job-gaps"],

[8, "You configure compute log delivery to a Unity Catalog volume for a job cluster so you can debug failures after the cluster terminates. How are the logs delivered?", ["Every five minutes, archived hourly, in a subfolder named after the cluster ID", "Once at termination, in a subfolder named after the job ID", "Every minute, in a subfolder named after the run ID", "Hourly, in each user's home folder under a Logs folder"], "Logs are delivered every five minutes and archived hourly; Databricks creates a subfolder named after the compute's `cluster_id`. Volumes are the recommended destination.", "https://docs.databricks.com/aws/en/compute/configure"],

[8, "Task B failed because of a bug. You fix its notebook and increase the job cluster size in the job settings, then click Repair run. Which settings does the repair use?", ["The current job and task settings, including the fix and the new cluster size", "The settings captured when the failed run started, ignoring later edits", "The fixed notebook, but the cluster size captured when the run started", "The original notebook, unless the job is started again with Run now"], "Unsuccessful tasks are re-run with the current job and task settings, so notebook path or cluster changes apply to the repair.", "https://docs.databricks.com/aws/en/jobs/repair-job-failures"],
[8, "In a first repair you overrode the job parameter `load_date`. On a second repair of the same run you want the parameter's original value back. What do you do in the Repair run dialog?", ["Clear the key and value of the overridden parameter", "Set the parameter's value to the literal `null`", "Nothing; each repair reverts overrides automatically", "Delete the first repair from the run's history"], "Parameters entered in the repair dialog override existing values; on later repairs you restore the original by clearing the key and value.", "https://docs.databricks.com/aws/en/jobs/repair-job-failures"],
[8, "A task appended part of its rows to a Delta table and then failed. Before repairing the run, what should the engineer consider?", ["The task re-runs from the start and may duplicate rows; use MERGE or overwrite", "The task resumes from its last commit, so no rows can be written twice", "Repair rolls back the partial write automatically using Delta time travel", "Repair skips tasks with partial writes, so they must be run with Run now"], "A repair re-runs each unsuccessful task from the beginning, and Lakeflow Jobs does not make tasks idempotent, so use overwrite or merge where duplicates matter.", "https://docs.databricks.com/aws/en/jobs/repair-job-failures"],
[8, "From the CLI, you want to repair a finished, failed job run by re-running all of its failed tasks. Which command is correct?", ["`databricks jobs repair-run <run-id> --rerun-all-failed-tasks`", "`databricks jobs run-now <job-id> --rerun-all-failed-tasks`", "`databricks jobs repair-run <job-id> --only-failed-tasks`", "`databricks jobs get-run <run-id> --rerun-all-failed-tasks`"], "`repair-run` takes the run ID of a run that is not in progress, and `--rerun-all-failed-tasks` repairs all failed tasks.", "https://docs.databricks.com/aws/en/dev-tools/cli/reference/jobs-commands"],
[8, "A bundle variable `catalog` has a top-level default of `dev`, the `prod` target sets it to `prod_cat`, and the CI runner exports `BUNDLE_VAR_catalog=hotfix_cat`. The deploy command also passes `--var='catalog=ci_cat'`. Which value is used?", ["`ci_cat`", "`hotfix_cat`", "`prod_cat`", "`dev`"], "The CLI uses the first value found in this order: `--var`, `BUNDLE_VAR_` environment variables, `variable-overrides.json`, target `variables`, then the top-level default.", "https://docs.databricks.com/aws/en/dev-tools/bundles/variables"],
[8, "A developer deploys a Declarative Automation Bundle to a target with `mode: development`. The bundle defines a job with a daily schedule. How is the job deployed?", ["With a `[dev <short_name>]` name prefix and its schedule paused", "With its original name and its schedule left active", "With its original name and its schedule paused", "With a `[dev <short_name>]` prefix and run once at deploy"], "Development mode prefixes resource names with `[dev ${workspace.current_user.short_name}]`, adds a `dev` tag and pauses all schedules and triggers.", "https://docs.databricks.com/aws/en/dev-tools/bundles/deployment-modes"],

[8, "A production job was created by hand in the UI. The team now defines the same job in a bundle and wants the bundle to manage the existing job instead of creating a duplicate. Which command should they run?", ["`databricks bundle deployment bind <job-key> <job-id>`", "`databricks bundle sync --full --watch <job-id>`", "`databricks bundle validate --output json <job-id>`", "`databricks bundle open <job-key> --force-pull`"], "`bundle deployment bind` links bundle-defined resources to existing resources in the workspace.", "https://docs.databricks.com/aws/en/dev-tools/cli/bundle-commands"],

[8, "In the Databricks-recommended CI/CD flow with Git folders, how is the production Git folder updated after a pull request is merged?", ["Automation calls the Repos API to pull changes into the production folder", "Each developer pulls into the production folder after their PR merges", "The production folder syncs itself after every push to any branch", "An admin deletes and re-clones the production folder for each release"], "When a PR merges, automation such as GitHub Actions or a scheduled job pulls changes into production Git folders using the Repos API; folders should not be updated by hand.", "https://docs.databricks.com/aws/en/repos/ci-cd-techniques-with-repos"],

[8, "Databricks recommends that production jobs reference a remote Git repository rather than a Git folder path. How does a remote Git source behave at run time?", ["It snapshots the given branch, tag or commit at run start, and all tasks use one commit", "Each task pulls the newest commit when it starts, so tasks can use different commits", "Code is copied into the workspace when the job is created and is never refreshed", "The job runs from the job owner's Git folder on whichever branch is checked out"], "Databricks takes a snapshot of the specified reference when a run starts, and all tasks in a job must reference the same commit.", "https://docs.databricks.com/aws/en/jobs/git"],
[8, "A notebook task uses a remote Git source and fails when it writes a temporary file into the repository's workspace path. Where should it write data instead?", ["Driver ephemeral storage for temporary data, or a volume or table for persistent data", "The job owner's Git folder, which is writable by tasks using a remote Git source", "A workspace file next to the notebook, after enabling sparse checkout on the source", "The repository root, after switching the Git reference from a branch to a tag"], "Tasks that use a remote repository cannot write to workspace files; write temporary data to driver ephemeral storage and persistent data to a volume or table.", "https://docs.databricks.com/aws/en/jobs/git"],

 "Databricks advises not partitioning tables under 1 TB and recommends liquid clustering for new tables. Liquid clustering can't be combined with partitioning or ZORDER.",
 "https://docs.databricks.com/aws/en/tables/partitions"],
[5, "A table is partitioned by `region` and Z-ordered by `customer_id`. When moving it to liquid clustering, which clustering keys does Databricks recommend?",
 ["Both `region` and `customer_id`", "Only `customer_id`", "Only `region`", "A hashed bucket column built from `customer_id`"],

[5, "A legacy table is partitioned by a generated `event_day` column derived from the `event_ts` timestamp. When converting it to liquid clustering, which key should be used?",
 ["`event_ts`, without creating the generated column", "`event_day`, keeping the generated column", "Both `event_day` and `event_ts`", "A new generated `event_hour` column"],

 "https://docs.databricks.com/aws/en/delta/clustering"],
[5, "On a 20 TB liquid clustered table, an engineer runs `ALTER TABLE t CLUSTER BY (country, product_id)` to replace the old keys. What happens to the existing data?",
 ["It stays as is until `OPTIMIZE t FULL` reclusters it", "It is rewritten right away by the ALTER TABLE statement", "It is rewritten by the next VACUUM on the table", "It can't be read until the next OPTIMIZE finishes"],

 "https://docs.databricks.com/aws/en/delta/clustering"],
[5, "A large Unity Catalog managed Delta table is partitioned by `sale_date`. The team wants to move it to liquid clustering in place on Databricks Runtime 18.1 and let predictive optimization adapt the keys over time. Which statement fits?",
 ["`ALTER TABLE t REPLACE PARTITIONED BY WITH CLUSTER BY AUTO`", "`ALTER TABLE t DROP PARTITIONED BY ADD CLUSTER BY AUTO`", "`ALTER TABLE t CLUSTER BY AUTO PARTITIONED BY NONE`", "`OPTIMIZE t ZORDER BY AUTO`"],
 "`REPLACE PARTITIONED BY WITH CLUSTER BY AUTO` starts from the current partition columns and lets predictive optimization adapt them. It needs Databricks Runtime 18.1+ and works only on Unity Catalog managed tables.",

// ---------- Section 6: Ensuring Data Security and Compliance ----------
// Objective: least-privilege ACLs
[6, "The `analysts` group needs to query only the table `prod.sales.orders`. Which set of grants follows least privilege?",
 ["SELECT on the table, USE SCHEMA on `prod.sales`, USE CATALOG on `prod`", "SELECT on the table only, with no grants on the parent objects", "ALL PRIVILEGES on the schema `prod.sales` and USE CATALOG on `prod`", "USE CATALOG and SELECT on the whole `prod` catalog"],

[6, "A platform engineer must investigate slow queries that other users ran on a SQL warehouse, including their query profiles, without being able to manage or change the warehouse. Which warehouse permission fits?",
 ["CAN MONITOR", "CAN USE", "CAN MANAGE", "IS OWNER"],
 "Viewing another user's query profile requires CAN MONITOR on the SQL warehouse that ran it (or being the query owner). CAN MANAGE and IS OWNER grant more than needed.",
 "https://docs.databricks.com/aws/en/sql/user/queries/query-profile"],
[6, "A data steward is granted MANAGE on a table so they can administer its grants. When they query the table, they get a permission error. Why?",
 ["MANAGE doesn't grant SELECT; they must grant it to themselves explicitly", "MANAGE applies only to catalogs and schemas, not to tables", "MANAGE takes effect only after ownership is transferred to them", "MANAGE gives data access only on external tables"],
 "A user with MANAGE isn't automatically granted every privilege and must grant themselves each one explicitly. They still need the usage privileges on the parent catalog and schema.",
 "https://docs.databricks.com/aws/en/data-governance/unity-catalog/manage-privileges/privileges"],

// Objective: ABAC with governed tags
[6, "A governance team writes an ABAC row filter policy on a catalog. The UDF must receive whichever column in each table carries the governed tag `region`. Which clauses do this?",
 ["`MATCH COLUMNS has_tag('region') AS rgn` with `USING COLUMNS (rgn)`", "`WHEN has_tag('region')` with `ON COLUMN region`", "`FOR COLUMNS TAGGED 'region'` with `USING (region)`", "`MATCH TABLES has_tag('region')` with `ON (rgn)`"],
 "MATCH COLUMNS selects columns by tag and gives them an alias, and USING COLUMNS passes aliases or literals to the UDF. WHEN tests table tags, and policies must use governed tags.",
 "https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/policies"],
[6, "After an ABAC policy is attached to a schema, a Lakeflow Job on standard compute with Databricks Runtime 15.4 LTS can no longer read its tables. What resolves this?",
 ["Move the job to Runtime 16.4+ or serverless, or add its principal to the policy's EXCEPT clause", "Grant the job's principal MANAGE on each table covered by the policy", "Switch the job to dedicated access mode on the same runtime", "Remove the governed tags from the tables while the job runs"],

[6, "Two ABAC column mask policies on the same schema both match the `email` column for the same user, and they call different masking UDFs. What happens when that user queries the table?",

// Objective: anonymization and pseudonymization
[6, "Analysts must join two tables on customer email but must never see real email addresses. Which column mask design supports the join?",
 ["A DETERMINISTIC UDF returning `SHA2(CONCAT(val, CAST(version AS STRING)), 256)`", "A UDF that returns the constant `'***'` for every non-admin user", "A UDF that returns `uuid()` in place of each email value", "A UDF that returns NULL for every user outside the admins group"],
 "A deterministic hash is pseudonymization: the same input always gives the same output, so joins still work. The version argument lets you rotate keys through USING COLUMNS.",
 "https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/common-patterns"],
[6, "A column mask on a DOUBLE `salary` column returns the exact value to HR, `ROUND(salary / 1000) * 1000` to managers, and should hide it from everyone else. Which statement about this mask is correct?",
 ["Every branch must return a value castable to DOUBLE, so `'CONFIDENTIAL'` would fail", "Masks always return STRING, so the salary is cast to STRING automatically", "Any return type works because masks are applied after the query finishes", "Rounding isn't allowed in masks; only constants and NULL are allowed"],
 "A mask's return type must match or be castable to the column type. Rounding to the nearest thousand generalizes the value, and a fallback like `0.0` keeps the type valid.",
 "https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/common-patterns"],
[6, "A customer makes a GDPR right-to-be-forgotten request. A colleague suggests applying a hashing column mask to their PII instead of deleting it. What does Databricks guidance say?",
 ["Delete the data, since complete erasure is the safest option", "Masking is enough, since masked values are never stored in files", "Hashing is enough if it uses SHA-256 with a version argument", "Masking is enough if time travel is disabled on the table"],
 "Databricks lists pseudonymization and masking as options but says the safest option is complete erasure, because removing reidentification risk often requires full deletion.",
 "https://docs.databricks.com/aws/en/security/privacy/gdpr-delta"],

// Objective: compliant PII pipeline across batch and streaming
[6, "A company wants PII columns in new tables, including streaming tables loaded by Lakeflow pipelines, to be detected and masked across a catalog without manual work per table. Which approach fits?",

 "Data Classification scans tables, streaming tables and materialized views and applies governed `class.*` tags. An ABAC policy on those tags then masks matching columns automatically.",
 "https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-classification"],
[6, "Data Classification is enabled on a catalog. Where are its results stored, and how soon are newly created tables usually scanned?",
 ["`system.data_classification.results`; new tables are usually scanned within 24 hours", "`system.data_classification.results`; new tables are scanned as part of each write", "`system.access.pii_detections`; new tables are usually scanned within 24 hours", "`system.access.pii_detections`; new tables are scanned only on manual full scans"],
 "Results are stored in `system.data_classification.results`, which contains sample values. Scanning is incremental, and new tables and columns are typically scanned within 24 hours.",

[6, "A Lakeflow pipeline builds a materialized view from a source table protected by an ABAC column mask. The pipeline's run-as identity is subject to that mask. What is the result, and the recommended fix?",
 ["The view stores masked data permanently; add the run-as identity to EXCEPT on source policies", "The view stores unmasked data; add a column mask to the view as well", "The refresh fails; grant the run-as identity MANAGE on the source table", "The view stores unmasked data; run the pipeline on dedicated compute"],
 "Refreshes run as the pipeline owner or run-as identity. If that identity is masked, the stored data is masked permanently, so add it to the EXCEPT clause of policies on the source tables.",
 "https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/requirements"],
[6, "A streaming table in a Lakeflow pipeline has a column mask that calls `is_account_group_member('hr')`. How is that function evaluated?",
 ["As the pipeline owner during refresh, and as the querying user at query time", "As the querying user both during refresh and at query time", "As the pipeline owner both during refresh and at query time", "As the workspace admin during refresh, and as the owner at query time"],
 "During refresh, filter and mask functions run with the pipeline owner's rights. At query time, user-context functions are evaluated for the invoker. Filters and masks are changed through `CREATE OR REFRESH`.",
 "https://docs.databricks.com/aws/en/ldp/unity-catalog"],

// Objective: data purging for retention and erasure
[6, "A Delta table with deletion vectors enabled holds a customer's PII that must be erased physically. Which sequence removes it from storage?",

 "With deletion vectors, DELETE is a soft delete. `REORG TABLE ... APPLY (PURGE)` rewrites the files, and VACUUM then removes the old files that still hold the data.",
