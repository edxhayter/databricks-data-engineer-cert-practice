<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Databricks Data Engineer Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Instrument+Sans:wght@400..600&display=swap">
<style>
/* Theme: a botanical field journal. Parchment paper, forest ink, plant-marker tags, raised beds.
   Layout: one working column (question card) with a rail that drops below it on phones. Keyboard first. */
:root {
  --paper: #f3eee2; --surface: #fbf9f3; --surface-2: #f5f0e4; --ink: #1d2a21; --muted: #66685a;
  --line: #ddd4c1; --line-strong: #c5b99f;
  --accent: #2e5e3e; --accent-ink: #fbf9f3; --accent-soft: #e2eadb;
  --good: #3a7a3e; --good-soft: #e4eedb; --bad: #a8472a; --bad-soft: #f6e3d9; --warn: #8f630f; --warn-soft: #f4e8cc;
  --soil: #8a6a4f; --soil-soft: #e8dcc6; --seed: #a07a55; --leaf: #3f8a4f; --bud: #c48a1c; --bloom: #b7476f; --bloom-soft: #f5e1e8;
  --stake: #e9dcc0; --stake-ink: #574329; --tint: rgba(60, 45, 20, .05);
  --shadow: 0 1px 2px rgba(60, 45, 20, .05), 0 10px 24px -18px rgba(60, 45, 20, .35);
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #10150f; --surface: #172019; --surface-2: #1c261e; --ink: #e9e5d6; --muted: #a4a690;
  --line: #2b362b; --line-strong: #3d4a3c;
  --accent: #9ccf95; --accent-ink: #10150f; --accent-soft: #213325;
  --good: #8fd08a; --good-soft: #1c3120; --bad: #f09a7b; --bad-soft: #3a2118; --warn: #e5b55c; --warn-soft: #352a14;
  --soil: #a88a6e; --soil-soft: #2a2519; --seed: #c99a6a; --leaf: #7cc27f; --bud: #e5b55c; --bloom: #ee8fb3; --bloom-soft: #3a1f2b;
  --stake: #2e291e; --stake-ink: #e3cfa6; --tint: rgba(255, 255, 255, .045);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 28px -18px rgba(0, 0, 0, .7); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #10150f; --surface: #172019; --surface-2: #1c261e; --ink: #e9e5d6; --muted: #a4a690;
  --line: #2b362b; --line-strong: #3d4a3c;
  --accent: #9ccf95; --accent-ink: #10150f; --accent-soft: #213325;
  --good: #8fd08a; --good-soft: #1c3120; --bad: #f09a7b; --bad-soft: #3a2118; --warn: #e5b55c; --warn-soft: #352a14;
  --soil: #a88a6e; --soil-soft: #2a2519; --seed: #c99a6a; --leaf: #7cc27f; --bud: #e5b55c; --bloom: #ee8fb3; --bloom-soft: #3a1f2b;
  --stake: #2e291e; --stake-ink: #e3cfa6; --tint: rgba(255, 255, 255, .045);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 28px -18px rgba(0, 0, 0, .7); color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper);
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.wrap { max-width: calc(var(--content) + 32px); margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Top bar: the one place to navigate. Menus open on hover with a mouse, and on click, tap or keyboard everywhere. */
:root { --content: 860px; }
body[data-mode="garden"] { --content: 1120px; }
.topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--paper) 86%, transparent); -webkit-backdrop-filter: saturate(1.2) blur(10px); backdrop-filter: saturate(1.2) blur(10px);
  border-bottom: 1px solid var(--line); }
.bar-in { max-width: calc(var(--content) + 32px); margin: 0 auto; height: 56px; display: flex; align-items: stretch; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mark { flex: none; align-self: center; width: 30px; height: 30px; padding: 0; margin-right: 10px; border: 0; border-radius: 50%; background: none; cursor: pointer; }
.mark svg { display: block; width: 100%; height: 100%; }
.menu { position: relative; display: flex; }
.menu.end { margin-left: auto; }
.menu-btn { display: inline-flex; align-items: center; gap: 6px; height: 100%; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted);
  font: 500 14px var(--body); white-space: nowrap; cursor: pointer; }
.menu-btn:hover, .menu.open > .menu-btn { color: var(--ink); }
.menu-btn[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.menu-btn .chev { width: 11px; height: 11px; opacity: .5; }
.menu.open > .menu-btn .chev { transform: rotate(180deg); }
.menu-btn.exam { padding-left: 0; color: var(--ink); font: 600 18px var(--display); font-variation-settings: "opsz" 36; letter-spacing: -.01em; }
.menu-btn .cur { overflow: hidden; max-width: 22ch; text-overflow: ellipsis; color: var(--muted); font-weight: 400; }
.menu-btn .cur:empty { display: none; }
.menu-btn.icon { padding: 0 6px 0 10px; }
.menu-btn.icon svg { width: 20px; height: 20px; }
.bar-sep { align-self: center; width: 1px; height: 18px; margin: 0 8px 0 6px; background: var(--line-strong); }
.pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 2; min-width: 220px; padding: 6px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px;
  box-shadow: 0 2px 4px rgba(40, 30, 10, .06), 0 18px 40px -16px rgba(40, 30, 10, .4); opacity: 0; visibility: hidden; transform: translateY(-4px);
  transition: opacity .12s, transform .12s, visibility 0s linear .12s; }
.pop::before { content: ""; position: absolute; left: 0; right: 0; top: -9px; height: 9px; } /* bridge so the pointer can travel from button to menu */
.menu.end .pop { left: auto; right: 0; }
.menu.open > .pop { opacity: 1; visibility: visible; transform: none; transition: opacity .12s, transform .12s; }
.pop.wide { width: 320px; }
.mi { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: none; color: var(--ink);
  font: 400 14px var(--body); text-align: left; cursor: pointer; }
.mi:hover, .mi:focus-visible { background: var(--surface-2); outline: none; }
.mi[aria-checked="true"] { font-weight: 600; }
.mi .note { font: 400 12px var(--mono); color: var(--muted); white-space: nowrap; }
.mi.danger { color: var(--bad); }
.pop hr { margin: 6px 4px; border: 0; border-top: 1px solid var(--line); }
.narrow-only { display: none !important; }
[hidden] { display: none !important; }
.linkish { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); }
.linkish:hover { text-decoration-color: currentColor; }
.linkish.quiet { color: var(--muted); font-size: 13.5px; }
/* Beds, listed in the Practice menu */
.beds { display: flex; flex-direction: column; }
.bed-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: baseline; width: 100%; padding: 7px 10px 9px; border: 0; border-radius: 6px;
  background: transparent; color: var(--ink); font: 400 14px/1.3 var(--body); text-align: left; cursor: pointer; }
.bed-row:hover, .bed-row:focus-visible { background: var(--surface-2); outline: none; }
.bed-row[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; }
.bed-row .bed-n { margin-right: 4px; font: 500 11.5px var(--mono); color: var(--muted); }
.bed-row .bed-v { font: 400 12px var(--mono); color: var(--muted); font-weight: 400; }
.bed-row .stack { grid-column: 1 / -1; height: 4px; }
.bed-row.wilt .bed-v { color: var(--bad); }
.beds hr { width: 100%; }
/* Readiness line: exam-weighted progress and the bed most worth tending next */
.ready { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 2px 2px 0; font-size: 13.5px; color: var(--muted); }
.ready b { color: var(--ink); font-weight: 600; }
.ready .score { color: var(--ink); font: 600 17px var(--display); font-variation-settings: "opsz" 30; font-variant-numeric: lining-nums tabular-nums; }
.ready .meter { display: inline-block; width: 64px; height: 4px; margin-left: 4px; overflow: hidden; border-radius: 2px; background: var(--soil-soft); vertical-align: middle; }
.ready .meter i { display: block; height: 100%; background: var(--accent); }
.ready .dot { color: var(--line-strong); }
.ready .go { margin-left: auto; font-size: 13.5px; }
.ready .here { margin-left: auto; color: var(--accent); }
body:not([data-mode="drill"]) .ready { display: none; }
/* Status line under the sheet: session numbers on the left, keyboard hints on the right */
.status { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; min-height: 20px; font: 400 12.5px var(--body); color: var(--muted); }
.status .keys { font-size: 12px; }
.status kbd { padding: 1px 5px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); color: var(--ink); font: 500 11px var(--mono); }
@media (hover: none) { .status .keys { display: none; } }

/* The question sits on one sheet; everything else sits directly on the paper. */
/* Specimen sheet: flat paper with hairline rules. A label strip on top, ruled answers, a footer strip for actions.
   --px and --pb are the sheet's side and bottom padding; strips and answer rows bleed to the edges using them. */
.sheet { --px: 36px; --pb: 30px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 var(--px) var(--pb); min-width: 0;
  box-shadow: 0 1px 2px rgba(60, 45, 20, .05); }
.sheet > :first-child:not(.meta) { margin-top: var(--pb); }
.meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font: 400 12px var(--mono); color: var(--muted); margin-bottom: 14px; }
.sheet > .meta { margin: 0 calc(-1 * var(--px)) 26px; padding: 12px var(--px); background: var(--surface-2); border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; }
/* Plant marker: a wooden stake label with a pointed end */
.tag { display: inline-flex; align-items: center; font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--stake-ink); background: var(--stake);
  padding: 6px 10px 6px 16px; clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%); border-radius: 0 3px 3px 0; }
.tag.repeat { background: var(--warn-soft); color: var(--warn); }
.tag.stretch { background: var(--accent-soft); color: var(--accent); }
.q { font-family: var(--display); font-size: 22px; line-height: 1.36; font-weight: 500; font-variation-settings: "opsz" 30; letter-spacing: -.008em; margin: 0 0 24px; text-wrap: pretty; }
code { font-family: var(--mono); font-size: .86em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.q code { font-size: .78em; vertical-align: .05em; }

/* Answers: a ruled list across the sheet; each letter sits in a seed */
.opts { display: flex; flex-direction: column; margin-inline: calc(-1 * var(--px)); border-top: 1px solid var(--line); }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; align-items: start; text-align: left; width: 100%; border: 0; border-bottom: 1px solid var(--line);
  border-radius: 0; background: transparent; color: var(--ink); padding: 14px var(--px); font: 15.5px/1.5 var(--body); cursor: pointer; box-shadow: inset 3px 0 0 transparent; }
.opt .k { width: 26px; height: 26px; margin-top: -1px; display: grid; place-items: center; border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%; border: 1px solid var(--line-strong);
  font: 500 12px var(--mono); color: var(--muted); background: var(--surface); }
.opt:hover:not(:disabled) { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
.opt:hover:not(:disabled) .k { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.opt.sel .k { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.right { background: var(--good-soft); box-shadow: inset 3px 0 0 var(--good); }
.opt.right .k { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.wrong { background: var(--bad-soft); box-shadow: inset 3px 0 0 var(--bad); }
.opt.wrong .k { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt:disabled { cursor: default; }
.opt:disabled:not(.right):not(.wrong) { color: var(--muted); }

/* Feedback: a field note set off by a single rule, not a box */
.feedback { overflow-wrap: anywhere; margin-top: 26px; padding: 2px 0 2px 18px; border-left: 2px solid var(--line-strong); }
.feedback.ok { border-left-color: var(--good); }
.feedback .why { display: block; }
.whynot { margin: 8px 0 10px; padding-left: 18px; }
.whynot li { margin: 3px 0; }
.feedback.no { border-left-color: var(--bad); }
.feedback strong { display: block; margin-bottom: 4px; font: 600 18px var(--display); font-variation-settings: "opsz" 24; }
.feedback.ok strong { color: var(--good); }
.feedback.no strong { color: var(--bad); }
.feedback a { display: inline-block; margin-top: 8px; font: 400 12px var(--mono); overflow-wrap: anywhere; }
/* Next strip: the sheet's footer becomes the way on. Left: what happened to the plant. Right: the next question. */
.sheet > .next-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin: 28px calc(-1 * var(--px)) calc(-1 * var(--pb)); padding: 12px var(--px) 12px calc(var(--px) - 4px);
  border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; background: var(--surface-2); cursor: pointer; }
.next-strip.grew, .next-strip.held { background: var(--good-soft); border-top-color: color-mix(in srgb, var(--good) 22%, var(--line)); }
.next-strip.bloomed { background: var(--bloom-soft); border-top-color: color-mix(in srgb, var(--bloom) 22%, var(--line)); }
.next-strip.wilted { background: var(--bad-soft); border-top-color: color-mix(in srgb, var(--bad) 22%, var(--line)); }
.next-strip:hover { background-image: linear-gradient(var(--tint), var(--tint)); }
.next-out { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; font-size: 13.5px; color: var(--ink); }
.next-out .plant { width: 30px; height: 30px; margin-block: -4px; }
.next-out .sep { color: var(--muted); }
.next-out .linkish { font-size: 13px; }
.next-go { display: inline-flex; align-items: center; gap: 12px; margin-left: auto; padding: 4px 0; border: 0; background: none; color: var(--ink); cursor: pointer;
  font: 600 16px var(--display); font-variation-settings: "opsz" 24; letter-spacing: -.005em; }
.next-go:focus-visible { outline: none; }
.next-go .arr { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); box-shadow: 0 1px 2px rgba(30, 40, 20, .2); }
.next-go .arr svg { width: 15px; height: 15px; }
.next-go:focus-visible .arr { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.next-strip.wilted .next-go .arr { background: var(--ink); color: var(--paper); }
@media (prefers-reduced-motion: no-preference) {
  .next-strip.grew .next-out .plant, .next-strip.bloomed .next-out .plant { transform-origin: 50% 90%; animation: sprout .55s cubic-bezier(.2, .9, .3, 1.3) both; }
  .next-go .arr { transition: transform .18s ease; }
  .next-strip:hover .next-go .arr, .next-go:focus-visible .arr { transform: translateX(4px); }
  .opt, .bed-row, .btn, .plot button { transition: border-color .15s, background-color .15s, color .15s, box-shadow .15s, transform .15s; }
}
@keyframes sprout { from { transform: scale(.4) translateY(4px); opacity: 0; } }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; }
.sheet > .actions:last-child { margin: 28px calc(-1 * var(--px)) calc(-1 * var(--pb)); padding: 14px var(--px); background: var(--surface-2); border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; }
.sheet > .opts + .actions:last-child { margin-top: 0; border-top: 0; }
/* Before answering, the ruled answers run to the bottom edge of the sheet */
.sheet > .opts:last-child { margin-bottom: calc(-1 * var(--pb)); }
.sheet > .opts:last-child .opt:last-child { border-bottom: 0; border-radius: 0 0 8px 8px; }
/* Buttons: primary is solid forest, secondary is neutral paper with a hairline. Keyboard shortcuts sit inside as small keys. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 38px; padding: 0 16px; border: 1px solid var(--accent); border-radius: 6px;
  background: var(--accent); color: var(--accent-ink); font: 600 14px/1 var(--body); letter-spacing: .005em; white-space: nowrap; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 1px 2px rgba(30, 40, 20, .14); }
.btn:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); border-color: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; transform: none; }
.btn.sm { height: 32px; padding: 0 14px; font-size: 13.5px; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); box-shadow: 0 1px 2px rgba(60, 45, 20, .06); }
.btn.ghost:hover { background: var(--surface-2); border-color: color-mix(in srgb, var(--ink) 28%, var(--line-strong)); }
.btn.ghost:disabled:hover { background: var(--surface); border-color: var(--line-strong); }
.btn.destructive { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.destructive:hover { background: color-mix(in srgb, var(--bad) 86%, var(--ink)); border-color: color-mix(in srgb, var(--bad) 86%, var(--ink)); }
.hint { font: 400 12px var(--mono); color: var(--muted); }

.secs { display: flex; flex-direction: column; gap: 9px; }
.sec { display: grid; grid-template-columns: 26px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13px; }
.sec .n { font: 500 12px var(--mono); color: var(--muted); }
.sec .v { font: 400 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.bar, .stack { display: flex; height: 10px; background: var(--soil-soft); border-radius: 999px; overflow: hidden; }
.bar i, .stack i { display: block; height: 100%; }
.bar i { background: var(--accent); }
.bar i.lo { background: var(--bad); } .bar i.mid { background: var(--warn); } .bar i.hi { background: var(--good); }
.small { font-size: 13px; color: var(--muted); }

/* Timed mock */
.timer { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; }
.timer.late { color: var(--bad); border-color: var(--bad); }
.dots { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line-strong); }
.dots button { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--muted); font: 11px var(--mono); cursor: pointer; padding: 0; }
.dots button.done { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.dots button.cur { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.review { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
.review .item { border-top: 1px solid var(--line); padding-top: 12px; }
.review .item p { margin: 4px 0; }
main .secs { margin-top: 4px; }

/* Garden: one plant per question, stage 0–5 */
.plant { display: inline-block; vertical-align: middle; flex: none; }
.stage { display: inline-flex; align-items: center; gap: 5px; }
.garden-head { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--muted); margin: 6px 0 18px; }
.garden-head span { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px 3px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); }
.garden-head b { color: var(--ink); font: 500 12px var(--mono); }
.bed { margin-bottom: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); overflow: hidden; }
.bed h3 { margin: 0; padding: 10px 14px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 10px; font: 600 16px var(--display); font-variation-settings: "opsz" 24; }
.bed h3 small { font: 400 11.5px var(--mono); color: var(--muted); }
.plot { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 10px 10px; border-bottom: 7px solid var(--soil-soft); }
.plot button { border: 1px solid transparent; background: transparent; padding: 2px; border-radius: 6px; cursor: pointer; line-height: 0; }
.plot button:hover { border-color: var(--line-strong); background: var(--surface); transform: translateY(-1px); }
.plot .plant { width: 24px; height: 24px; }

<script>
(function () {
const KEYS = { assoc: "de-associate-practice-v2", pro: "de-professional-practice-v2", choice: "de-practice-exam" };
// Before question ids, progress was saved against each question's position in the bank under these keys.
// They're read once to convert, then left untouched as a fallback copy.
const OLD_KEYS = { assoc: "de-associate-practice-v1", pro: "de-professional-practice-v1" };
const BACKUP_APP = "databricks-de-practice";
const EXAMS = {
  assoc: {
    title: "Data Engineer Associate Practice", name: "Associate", bank: BANK, stretch: typeof BANK_STRETCH !== "undefined" ? BANK_STRETCH : [], links: LINKS, total: 45, minutes: 90,
    sections: { 1: "Platform", 2: "Ingestion", 3: "Transform", 4: "Jobs", 5: "CI/CD", 6: "Optimize", 7: "Governance" },
    weight: { 1: 6, 2: 21, 3: 22, 4: 16, 5: 10, 6: 10, 7: 15 },
    split: { 1: 3, 2: 9, 3: 10, 4: 7, 5: 5, 6: 4, 7: 7 },
  },
  pro: {
    title: "Data Engineer Professional Practice", name: "Professional", bank: PBANK, stretch: typeof PBANK_STRETCH !== "undefined" ? PBANK_STRETCH : [], links: {}, total: 60, minutes: 120,
    sections: { 1: "Code", 2: "Ingestion", 3: "Manipulation", 4: "Monitoring", 5: "Cost & perf", 6: "Security", 7: "Governance", 8: "Debug & deploy", 9: "Modeling" },
    weight: { 1: 23, 2: 12, 3: 12, 4: 10, 5: 15, 6: 8, 7: 5, 8: 10, 9: 5 },
    split: { 1: 14, 2: 7, 3: 7, 4: 6, 5: 9, 6: 5, 7: 3, 8: 6, 9: 3 },

};
// Split each question's permanent id off the front. The app works with positions in the bank while it runs,
// and saved progress uses the ids, so editing or reordering the bank doesn't move anyone's plants.
Object.values(EXAMS).forEach((x) => {
  x.ids = x.bank.map((q) => q[0]);
  x.bank = x.bank.map((q) => q.slice(1));
  x.pos = {};
  x.ids.forEach((id, i) => { if (id in x.pos) console.error(`Duplicate question id ${id}`); x.pos[id] = i; });
  x.stretch = new Set(x.stretch.map((id) => x.pos[id]).filter((i) => i !== undefined)); // positions of stretch questions
});
const LETTERS = ["A", "B", "C", "D"];
const $ = (id) => document.getElementById(id);

// ---- persistence (per-browser convenience only) ----
let examId = "assoc";
try { const e = localStorage.getItem(KEYS.choice); if (e && EXAMS[e] && EXAMS[e].bank.length) examId = e; } catch (e) {}
let X = EXAMS[examId], BANKX = X.bank;
// In memory, `store` is keyed by position in BANKX. Saved progress is keyed by question id.
// `orphans` holds saved progress for ids no longer in the bank, so it survives if a question comes back.
const MAPS = ["stats", "retry", "garden"];
const blank = () => ({ v: 2, stats: {}, retry: {}, garden: {}, filter: "all", tick: 0 });
let store, orphans;

// Keep only well-formed entries from saved or imported progress.
function clean(raw, x) {
  if (!raw || typeof raw !== "object") return null;
  const s = blank(), num = (v) => typeof v === "number" && isFinite(v), obj = (o) => (o && typeof o === "object" ? o : {});
  Object.entries(obj(raw.stats)).forEach(([k, v]) => { if (v && num(v.c) && num(v.w)) s.stats[k] = num(v.g) ? { c: v.c, w: v.w, g: v.g } : { c: v.c, w: v.w }; });
  Object.entries(obj(raw.retry)).forEach(([k, v]) => { if (num(v) && v > 0) s.retry[k] = v; });
  Object.entries(obj(raw.garden)).forEach(([k, v]) => { if (v && Number.isInteger(v.st) && v.st >= 0 && v.st <= 5 && num(v.due)) s.garden[k] = { st: v.st, due: v.due }; });
  s.tick = num(raw.tick) ? raw.tick : 0;
  s.filter = raw.filter === "missed" || x.sections[raw.filter] ? String(raw.filter) : "all";
  return s;
}
// Turn pre-garden history into starting stages so earlier practice isn't lost.
function plantFromHistory(o) {
  o.garden = {};
  Object.keys(o.stats).forEach((k) => {
    const s = o.stats[k];
    const st = o.retry[k] > 0 ? 0 : s.c - s.w >= 2 ? 2 : s.c > 0 ? 1 : 0;
    o.garden[k] = { st, due: rand(0, GAP[st]) };
  });
  Object.keys(o.retry).forEach((k) => { if (o.retry[k] > 0 && !o.garden[k]) o.garden[k] = { st: 0, due: 0 }; });
}
// Saved progress for one exam, keyed by question id, or null if there is none.
// Falls back to the old position-keyed save and converts it: position i becomes the id at position i.
function readSaved(id) {
  const x = EXAMS[id];
  try { const raw = localStorage.getItem(KEYS[id]); if (raw) return clean(JSON.parse(raw), x); } catch (e) {}
  let old = null;
  try { const raw = localStorage.getItem(OLD_KEYS[id]); if (raw) old = JSON.parse(raw); } catch (e) {}
  if (!old || typeof old !== "object") return null;
  old = Object.assign({}, old, { stats: old.stats || {}, retry: old.retry || {} });
  if (!old.garden) plantFromHistory(old);
  const s = Object.assign(blank(), { filter: old.filter, tick: old.tick || 0 });
  MAPS.forEach((m) => Object.keys(old[m]).forEach((k) => { const qid = /^\d+$/.test(k) ? x.ids[k] : null; if (qid) s[m][qid] = old[m][k]; }));
  return clean(s, x);
}
function loadStore() {
  let first = false;
  try { first = localStorage.getItem(KEYS[examId]) === null; } catch (e) {}
  const s = readSaved(examId);
  store = { stats: {}, retry: {}, garden: {}, filter: s ? s.filter : "all", tick: s ? s.tick : 0 };
  orphans = { stats: {}, retry: {}, garden: {} };
  if (s) MAPS.forEach((m) => Object.keys(s[m]).forEach((qid) => {
    const i = X.pos[qid];
    if (i === undefined) orphans[m][qid] = s[m][qid]; else store[m][i] = s[m][qid];
  }));
  if (s && first) save(); // first visit since question ids: save the converted copy straight away
}
function toSaved() {
  const s = Object.assign(blank(), { filter: store.filter, tick: store.tick });
  MAPS.forEach((m) => { Object.assign(s[m], orphans[m]); Object.keys(store[m]).forEach((i) => { s[m][X.ids[i]] = store[m][i]; }); });
  return s;
}
function save() { try { localStorage.setItem(KEYS[examId], JSON.stringify(toSaved())); } catch (e) {} }

// ---- garden ----
// Stage 0 = answered but not yet right; 1–5 = seed → bloom. Every correct answer grows one stage; a wrong answer resets to 0.
// GAP[st] = roughly how many questions pass before a plant at that stage comes back.
// Each gap gets a random ±25% spread so plants first met together drift apart instead of returning as a block.
const GAP = [0, 4, 10, 22, 45, 120];
const spread = (g) => g + rand(-Math.floor(g / 4), Math.floor(g / 4));
// Share of picks that are new questions, by how many plants are due: fewer new ones while reviews are waiting,
// so plants come back close to on time instead of piling up.
const newShare = (nDue) => (nDue <= 5 ? 0.5 : nDue <= 15 ? 1 / 3 : 0.15);
const STAGE = ["Not rooted yet", "Seed", "Sprout", "Seedling", "Bud", "Bloom"];
const gst = (i) => (store.garden[i] ? store.garden[i].st : -1);
const stageLabel = (st) => (st < 0 ? "New question" : st === 0 ? STAGE[0] : `${STAGE[st]} ${st}/5`);
function plant(st) {
  const L = (y) => `<path d="M10 ${y}c-1-3-3.5-3.6-5.2-3.5c.3 2.3 2.1 3.7 5.2 3.5z" fill="var(--leaf)"/>`;
  const R = (y) => `<path d="M10 ${y}c1-3 3.5-3.6 5.2-3.5c-.3 2.3-2.1 3.7-5.2 3.5z" fill="var(--leaf)"/>`;
  const stem = (top) => `<path d="M10 17.5V${top}" stroke="var(--leaf)" stroke-width="1.6" stroke-linecap="round"/>`;
  let b = "";
  if (st === 0) b = `<path d="M8.2 12.6l3.6 3.2M11.8 12.6l-3.6 3.2" stroke="var(--bad)" stroke-width="1.5" stroke-linecap="round"/>`;
  else if (st === 1) b = `<ellipse cx="10" cy="15.3" rx="2.5" ry="1.8" fill="var(--seed)"/>`;
  else if (st === 2) b = stem(14) + L(14) + R(14);
  else if (st === 3) b = stem(8.5) + L(15.5) + R(13) + L(10.5);
  else if (st === 4) b = stem(7) + L(15.5) + R(13) + `<ellipse cx="10" cy="5.6" rx="2.1" ry="3" fill="var(--bud)"/>`;
  else if (st === 5) b = stem(7) + L(15.5) + R(13) + [[0, -2.7], [2.57, -0.83], [1.59, 2.18], [-1.59, 2.18], [-2.57, -0.83]]
    .map(([x, y]) => `<circle cx="${10 + x}" cy="${5.4 + y}" r="2.3" fill="var(--bloom)"/>`).join("") + `<circle cx="10" cy="5.4" r="1.5" fill="var(--bud)"/>`;
  return `<svg class="plant" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 17.6h14" stroke="var(--soil)" stroke-width="2" stroke-linecap="round"${st < 0 ? ' opacity=".35"' : ""}/>${b}</svg>`;
}

// ---- helpers ----
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
// Explanations: first line says why the answer is right; each later line (after "\n") says why one wrong option is wrong.
const fmtExpl = (s) => { const [first, ...rest] = s.split("\n"); return `<span class="why">${fmt(first)}</span>` + (rest.length ? `<ul class="whynot">${rest.map((l) => `<li>${fmt(l)}</li>`).join("")}</ul>` : ""); };
const stat = (id) => store.stats[id] || (store.stats[id] = { c: 0, w: 0 });
const link = (q) => (/^https?:/.test(q[4]) ? q[4] : X.links[q[4]]);

// ---- session ----
let mode = "drill";
let session = { answered: 0, correct: 0, time: 0, grew: 0 };
let queue = [], cur = null, perm = null, picked = null, shownAt = 0, lastId = null, outcome = null, undo = null;

function pool() {
  const ids = BANKX.map((_, i) => i);
  if (store.filter === "missed") return ids.filter((i) => store.retry[i] > 0 || (store.stats[i] && store.stats[i].w > 0));
  if (store.filter === "all") return ids;
  return ids.filter((i) => BANKX[i][0] === Number(store.filter));
}
// Pick the next plant: a due growing plant, chosen at random so stages and planting groups mix,
// or a new question (how often depends on how many plants are due, see newShare).
// Blooms due a recheck come back when nothing else is due and no new questions are left.
function nextQ() {
  let p = pool();
  if (p.length > 1) p = p.filter((i) => i !== lastId);
  if (!p.length) { renderEmpty(); return; }
  const T = store.tick, g = store.garden, due = [], blooms = [], fresh = [], later = [];
  p.forEach((i) => { const e = g[i]; if (!e) fresh.push(i); else if (e.due <= T) (e.st === 5 ? blooms : due).push(i); else later.push(i); });
  let id;
  if (due.length && (!fresh.length || Math.random() >= newShare(due.length))) {
    id = due[Math.floor(Math.random() * due.length)];
  } else if (fresh.length) id = fresh[Math.floor(Math.random() * fresh.length)];
  else if (blooms.length) id = blooms.sort((a, b) => g[a].due - g[b].due)[0];
  else id = later.sort((a, b) => g[a].due - g[b].due)[0]; // nothing due: go over plants early (they won't grow)
  show(id);
}
function show(id) {
  cur = id; lastId = id; perm = shuffle([0, 1, 2, 3]); picked = null; outcome = null; undo = null; shownAt = Date.now();
  renderDrill();
}
function answer(slot) {
  if (picked !== null || cur === null) return;
  picked = slot;
  const ok = perm[slot] === 0, s = stat(cur), T = ++store.tick, had = store.garden[cur];
  undo = { e: had ? Object.assign({}, had) : null, retry: store.retry[cur], grew: 0 };
  const e = had || { st: 0, due: 0 }, from = e.st;
  session.answered++; session.time += Math.min(Date.now() - shownAt, 300000);
  if (ok) {
    s.c++; session.correct++;
    if (e.st < 5) {
      e.st++; session.grew++; undo.grew = 1;
      outcome = { kind: e.st === 5 ? "bloomed" : "grew", from, to: e.st };
    } else outcome = { kind: "held", from, to: 5 };
    e.due = T + spread(GAP[e.st]);
    if (store.retry[cur] > 0) {
      store.retry[cur]--;
      if (store.retry[cur] > 0) e.due = Math.min(e.due, T + rand(8, 14)); else delete store.retry[cur];
    }
  } else {
    s.w++;
    e.st = 0;                                       // any wrong answer resets the plant, blooms included
    e.due = T + rand(3, 6);
    store.retry[cur] = 2;                            // must get it right twice more
    outcome = { kind: "wilted", from, to: e.st, fresh: !had };
  }
  store.garden[cur] = e;
  save(); renderDrill(); renderRail();
}
// "I guessed": undo any growth from a lucky correct answer and bring it back soon.
function guessed() {
  if (picked === null || !outcome || outcome.kind === "wilted" || outcome.kind === "guessed") return;
  const e = undo.e ? Object.assign({}, undo.e) : { st: 0, due: 0 }, s = stat(cur);
  e.due = store.tick + rand(3, 6);
  store.garden[cur] = e;
  if (undo.retry > 0) store.retry[cur] = undo.retry;
  s.g = (s.g || 0) + 1; session.grew -= undo.grew;
  outcome = { kind: "guessed", from: e.st, to: e.st };
  save(); renderDrill(); renderRail();
}
function growthMsg(o) {
  const n = (st) => STAGE[st].toLowerCase();
  if (o.kind === "grew") return o.from === 0 ? "Seed planted" : "Grew to " + n(o.to);

  const text = `My ${X.title} wilting questions:\n` + rows.join("\n");
  const fallback = () => ask({ title: "Copy wilting questions", text: "Your browser blocked the clipboard, so select the text and copy it.", body: `<textarea class="copybox" readonly>${esc(text)}</textarea>` });
  try { navigator.clipboard.writeText(text).then(() => toast(`Copied ${rows.length} wilting question${rows.length === 1 ? "" : "s"}`), fallback); } catch (e) { fallback(); }
});
$("reset").addEventListener("click", () => {
  closeMenus();
  ask({ title: `Reset ${X.name} progress?`, text: "This clears the garden, wilting questions and stats for this exam in this browser. Export a backup first if you might want them back.", ok: "Reset", danger: true,
    onOk: () => { store = { stats: {}, retry: {}, filter: "all", garden: {}, tick: 0 }; orphans = { stats: {}, retry: {}, garden: {} }; save(); session = { answered: 0, correct: 0, time: 0, grew: 0 }; setMode(mode); toast("Progress reset"); } });
});
const plantCount = (sv, id) => Object.keys(sv.garden).filter((qid) => qid in EXAMS[id].pos).length;
const summarise = (exams) => Object.keys(exams).map((id) => `${EXAMS[id].name}: ${plantCount(exams[id], id)} plants`).join(" · ");
$("export").addEventListener("click", () => {
  closeMenus();
  const data = { app: BACKUP_APP, format: 2, exported: new Date().toISOString(), exams: {} };
  Object.keys(EXAMS).forEach((id) => { const sv = id === examId ? toSaved() : readSaved(id); if (sv) data.exams[id] = sv; });
  if (!Object.keys(data.exams).length) return toast("Nothing to export yet");
  try {
    const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = `databricks-practice-progress-${data.exported.slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Backup downloaded · " + summarise(data.exams));
  } catch (e) { toast("Your browser blocked the download"); }
});
$("import").addEventListener("click", () => { closeMenus(); $("importfile").click(); });
$("importfile").addEventListener("change", (ev) => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  const r = new FileReader();
  r.onerror = () => toast("Couldn't read that file");
  r.onload = () => {
    let data = null;
    try { data = JSON.parse(r.result); } catch (e) {}
    if (!data || data.app !== BACKUP_APP || !data.exams || typeof data.exams !== "object") return toast("That file isn't a progress backup from this page");
    const found = {};
    Object.keys(EXAMS).forEach((id) => { const sv = clean(data.exams[id], EXAMS[id]); if (sv) found[id] = sv; });
    if (!Object.keys(found).length) return toast("That backup doesn't contain any progress");
    const when = typeof data.exported === "string" ? new Date(data.exported) : null;
    ask({ title: "Replace progress with this backup?", text: `${when && !isNaN(when) ? `Saved ${esc(when.toLocaleDateString())}. ` : ""}${summarise(found)}. This replaces the progress in this browser.`, ok: "Replace", danger: true,
      onOk: () => {
        try { Object.keys(found).forEach((id) => localStorage.setItem(KEYS[id], JSON.stringify(found[id]))); }
        catch (e) { return toast("Your browser wouldn't save the imported progress"); }
        setExam(examId);
        toast("Progress imported");
      } });
  };
  r.readAsText(file);
});

// ---- light / dark ----
// The choice is remembered in this browser; until someone picks one, the page follows the system setting.
const darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : !!(darkQuery && darkQuery.matches); };
function labelTheme() { $("theme").textContent = isDark() ? "Light mode" : "Dark mode"; }
$("theme").addEventListener("click", () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("de-practice-theme", t); } catch (e) {}
  labelTheme(); closeMenus();
});
if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener("change", labelTheme);
labelTheme();

setExam(examId);
})();
</script>
