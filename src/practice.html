[6, "A streaming table reads from a Delta source. To meet an erasure request, user rows are deleted from both the source and the streaming table with DML. How should the streaming read change so it keeps running without a full refresh?",
 ["Add `.option('skipChangeCommits', 'true')` to the streaming read", "Add `.option('readChangeFeed', 'true')` to the streaming read", "Add `.option('ignoreDeletes', 'false')` to the streaming read", "Set `startingVersion` to the version of the delete commit"],
 "Updates or deletes in a Delta source break an append-only stream. `skipChangeCommits` makes the stream skip anything other than inserts, avoiding a full refresh that may lose data past upstream retention.",
 "https://docs.databricks.com/aws/en/security/privacy/gdpr-delta"],
[6, "A team deletes user records from a Delta table and runs `VACUUM` with default settings. Which files does VACUUM remove?",
 ["Files no longer referenced by the table that were removed over 7 days ago", "All files not referenced by the current version, regardless of age", "Files no longer referenced by the table that were removed over 30 days ago", "Only transaction log entries that are older than 30 days"],
 "VACUUM's default retention threshold is 7 days, set by `delta.deletedFileRetentionDuration`. After VACUUM you can no longer time travel to versions older than the retention period.",
 "https://docs.databricks.com/aws/en/sql/language-manual/delta-vacuum"]
);

</script>
<script>
(function () {
const KEYS = {"assoc": "de-associate-practice-v1", "pro": "de-professional-practice-v1", "choice": "de-practice-exam"};
const EXAMS = {
  assoc: {
    title: "Data Engineer Associate Practice", bank: BANK, links: LINKS, total: 45, minutes: 90,
    sections: { 1: "Platform", 2: "Ingestion", 3: "Transform", 4: "Jobs", 5: "CI/CD", 6: "Optimize", 7: "Governance" },
    weight: { 1: 6, 2: 21, 3: 22, 4: 16, 5: 10, 6: 10, 7: 15 },
    split: { 1: 3, 2: 9, 3: 10, 4: 7, 5: 5, 6: 4, 7: 7 },
  },
  pro: {
    title: "Data Engineer Professional Practice", bank: PBANK, links: {}, total: 60, minutes: 120,
    sections: { 1: "Code", 2: "Ingestion", 3: "Manipulation", 4: "Monitoring", 5: "Cost & perf", 6: "Security", 7: "Governance", 8: "Debug & deploy", 9: "Modeling" },
    weight: { 1: 23, 2: 12, 3: 12, 4: 10, 5: 15, 6: 8, 7: 5, 8: 10, 9: 5 },
    split: { 1: 14, 2: 7, 3: 7, 4: 6, 5: 9, 6: 5, 7: 3, 8: 6, 9: 3 },
  },
};
const LETTERS = ["A", "B", "C", "D"];
const $ = (id) => document.getElementById(id);

// ---- persistence (per-browser convenience only) ----
let examId = "assoc";
try { const e = localStorage.getItem(KEYS.choice); if (e && EXAMS[e] && EXAMS[e].bank.length) examId = e; } catch (e) {}
let X = EXAMS[examId], BANKX = X.bank;
let store;
function loadStore() {
  store = { stats: {}, retry: {}, filter: "all" };
  try { const raw = localStorage.getItem(KEYS[examId]); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
  if (store.filter !== "all" && store.filter !== "missed" && !X.sections[store.filter]) store.filter = "all";
  if (!store.garden) migrate();
}
// Turn pre-garden history into starting stages so earlier practice isn't lost.
function migrate() {
  store.garden = {}; store.tick = store.tick || 0;
  Object.keys(store.stats).forEach((k) => {
    const s = store.stats[k];
    const st = store.retry[k] > 0 ? 0 : s.c - s.w >= 2 ? 2 : s.c > 0 ? 1 : 0;
    store.garden[k] = { st, due: rand(0, GAP[st]) };
  });
  Object.keys(store.retry).forEach((k) => { if (store.retry[k] > 0 && !store.garden[k]) store.garden[k] = { st: 0, due: 0 }; });
}
function save() { try { localStorage.setItem(KEYS[examId], JSON.stringify(store)); } catch (e) {} }

// ---- garden ----
// Stage 0 = answered but not yet right; 1–5 = seed → bloom. GAP[st] = questions that must pass before it can grow again.
const GAP = [0, 5, 15, 40, 80, 150];
const STAGE = ["Not rooted yet", "Seed", "Sprout", "Seedling", "Bud", "Bloom"];
const gst = (i) => (store.garden[i] ? store.garden[i].st : -1);
const stageLabel = (st) => (st < 0 ? "New question" : st === 0 ? STAGE[0] : `${STAGE[st]} ${st}/5`);
function plant(st) {
  const L = (y) => `<path d="M10 ${y}c-1-3-3.5-3.6-5.2-3.5c.3 2.3 2.1 3.7 5.2 3.5z" fill="var(--leaf)"/>`;
  const R = (y) => `<path d="M10 ${y}c1-3 3.5-3.6 5.2-3.5c-.3 2.3-2.1 3.7-5.2 3.5z" fill="var(--leaf)"/>`;
  const stem = (top) => `<path d="M10 17.5V${top}" stroke="var(--leaf)" stroke-width="1.6" stroke-linecap="round"/>`;
  let b = "";
  if (st === 0) b = `<path d="M8.2 12.6l3.6 3.2M11.8 12.6l-3.6 3.2" stroke="var(--bad)" stroke-width="1.5" stroke-linecap="round"/>`;
  else if (st === 1) b = `<ellipse cx="10" cy="15.3" rx="2.5" ry="1.8" fill="var(--seed)"/>`;
  else if (st === 2) b = stem(14) + L(14) + R(14);
  else if (st === 3) b = stem(8.5) + L(15.5) + R(13) + L(10.5);
  else if (st === 4) b = stem(7) + L(15.5) + R(13) + `<ellipse cx="10" cy="5.6" rx="2.1" ry="3" fill="var(--bud)"/>`;
  else if (st === 5) b = stem(7) + L(15.5) + R(13) + [[0, -2.7], [2.57, -0.83], [1.59, 2.18], [-1.59, 2.18], [-2.57, -0.83]]
    .map(([x, y]) => `<circle cx="${10 + x}" cy="${5.4 + y}" r="2.3" fill="var(--bloom)"/>`).join("") + `<circle cx="10" cy="5.4" r="1.5" fill="var(--bud)"/>`;
  return `<svg class="plant" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 17.6h14" stroke="var(--soil)" stroke-width="2" stroke-linecap="round"${st < 0 ? ' opacity=".35"' : ""}/>${b}</svg>`;
}

// ---- helpers ----
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const stat = (id) => store.stats[id] || (store.stats[id] = { c: 0, w: 0 });
const link = (q) => (/^https?:/.test(q[4]) ? q[4] : X.links[q[4]]);

// ---- session ----
let mode = "drill";
let session = { answered: 0, correct: 0, time: 0, grew: 0 };
let queue = [], cur = null, perm = null, picked = null, shownAt = 0, lastId = null, outcome = null, undo = null;

function pool() {
  const ids = BANKX.map((_, i) => i);
  if (store.filter === "missed") return ids.filter((i) => store.retry[i] > 0 || (store.stats[i] && store.stats[i].w > 0));
  if (store.filter === "all") return ids;
  return ids.filter((i) => BANKX[i][0] === Number(store.filter));
}
// Pick the next plant: due growing plants (longest overdue first) about two times in three,
// otherwise a new question; blooms come back when their recheck is due.
function nextQ() {
  let p = pool();
  if (p.length > 1) p = p.filter((i) => i !== lastId);
  if (!p.length) { renderEmpty(); return; }
  const T = store.tick, g = store.garden, due = [], blooms = [], fresh = [], later = [];
  p.forEach((i) => { const e = g[i]; if (!e) fresh.push(i); else if (e.due <= T) (e.st === 5 ? blooms : due).push(i); else later.push(i); });
  let id;
  if (due.length && (!fresh.length || Math.random() < 2 / 3)) {
    due.sort((a, b) => g[a].due - g[b].due || g[a].st - g[b].st);
    id = due[Math.floor(Math.random() * Math.min(3, due.length))];
  } else if (fresh.length) id = fresh[Math.floor(Math.random() * fresh.length)];
  else if (blooms.length) id = blooms.sort((a, b) => g[a].due - g[b].due)[0];
  else id = later.sort((a, b) => g[a].due - g[b].due)[0]; // nothing due: practise ahead (it won't grow)
  show(id);
}
function show(id) {
  cur = id; lastId = id; perm = shuffle([0, 1, 2, 3]); picked = null; outcome = null; undo = null; shownAt = Date.now();
  renderDrill();
}
function answer(slot) {
  if (picked !== null || cur === null) return;
  picked = slot;
  const ok = perm[slot] === 0, s = stat(cur), T = ++store.tick, had = store.garden[cur];
  undo = { e: had ? Object.assign({}, had) : null, retry: store.retry[cur], grew: 0 };
  const e = had || { st: 0, due: 0 }, from = e.st;
  session.answered++; session.time += Math.min(Date.now() - shownAt, 300000);
  if (ok) {
    s.c++; session.correct++;
    if (e.st === 0 || (e.st < 5 && T >= e.due)) {
      e.st++; session.grew++; undo.grew = 1;
      outcome = { kind: e.st === 5 ? "bloomed" : "grew", from, to: e.st };
    } else if (e.st === 5 && T >= e.due) outcome = { kind: "held", from, to: 5 };
    else outcome = { kind: "early", from, to: e.st, wait: e.due - T };
    if (outcome.kind !== "early") e.due = T + GAP[e.st] + rand(0, Math.floor(GAP[e.st] / 5));
    if (store.retry[cur] > 0) {
      store.retry[cur]--;
      if (store.retry[cur] > 0) e.due = Math.min(e.due, T + rand(8, 14)); else delete store.retry[cur];
    }
  } else {
    s.w++;
    e.st = e.st === 5 ? 2 : Math.max(0, e.st - 2); // a bloom wilts to a sprout; anything else drops two stages
    e.due = T + rand(3, 6);
    store.retry[cur] = 2;                            // must get it right twice more
    outcome = { kind: "wilted", from, to: e.st, fresh: !had };
  }
  store.garden[cur] = e;
  save(); renderDrill(); renderRail();
}
// "I guessed": undo any growth from a lucky correct answer and bring it back soon.
function guessed() {
  if (picked === null || !outcome || outcome.kind === "wilted" || outcome.kind === "guessed") return;
  const e = undo.e ? Object.assign({}, undo.e) : { st: 0, due: 0 }, s = stat(cur);
  e.due = store.tick + rand(3, 6);
  store.garden[cur] = e;
  if (undo.retry > 0) store.retry[cur] = undo.retry;
  s.g = (s.g || 0) + 1; session.grew -= undo.grew;
  outcome = { kind: "guessed", from: e.st, to: e.st };
  save(); renderDrill(); renderRail();
}
function growthMsg(o) {
  const n = (st) => STAGE[st].toLowerCase();
  if (o.kind === "grew") return o.from === 0 ? `Seed planted. It can grow again after about ${GAP[1]} more questions.` : `Grew to ${n(o.to)} (${o.to}/5). It can grow again after about ${GAP[o.to]} more questions.`;
  if (o.kind === "bloomed") return "In bloom! It will come back now and then to check it has stuck.";
  if (o.kind === "held") return `Still in bloom. Next check in about ${GAP[5]} questions.`;
  if (o.kind === "early") return `Right, but too soon to grow. It needs about ${o.wait} more question${o.wait === 1 ? "" : "s"} of spacing first.`;
  if (o.kind === "guessed") return "Marked as a guess, so it didn't grow. It will come back in a few questions.";
  if (o.fresh || o.from === o.to) return "Not rooted yet. It will come back in a few questions.";
  return `Wilted from ${n(o.from)} to ${n(o.to)}. It will come back in a few questions.`;
}

// ---- drill render ----
function renderDrill() {
  const q = BANKX[cur], s = store.stats[cur];
  const isRepeat = store.retry[cur] > 0 && picked === null;
  let h = `<div class="meta"><span class="tag">S${q[0]} · ${X.sections[q[0]]}</span>`;
  if (isRepeat) h += `<span class="tag repeat">Repeat of a miss</span>`;
  const st = picked !== null && outcome ? outcome.from : gst(cur);
  h += `<span class="stage">${plant(picked !== null && undo && undo.e === null ? -1 : st)}${stageLabel(picked !== null && undo && undo.e === null ? -1 : st)}</span>`;
  if (s) h += `<span>seen ${s.c + s.w}× · missed ${s.w}×</span>`;
  h += `</div><p class="q">${fmt(q[1])}</p>`;
  h += `<div class="opts">`;
  perm.forEach((oi, slot) => {
    let cls = "opt";
    if (picked !== null) { if (oi === 0) cls += " right"; else if (slot === picked) cls += " wrong"; }
    h += `<button class="${cls}" data-slot="${slot}" ${picked !== null ? "disabled" : ""}><span class="k">${LETTERS[slot]}</span><span>${fmt(q[2][oi])}</span></button>`;
  });
  h += `</div>`;
  if (picked !== null) {
    const ok = perm[picked] === 0, url = link(q);
    h += `<div class="feedback ${ok ? "ok" : "no"}"><strong>${ok ? "Correct" : "Not quite. Answer: " + LETTERS[perm.indexOf(0)]}</strong>${fmt(q[3])}<br><a href="${url}" target="_blank" rel="noopener">${url.replace("https://", "")}</a>`;
    h += `</div><div class="growth">${plant(outcome.to)}<span>${growthMsg(outcome)}</span></div>`;
    const canGuess = ok && outcome.kind !== "guessed";
    h += `<div class="actions"><button class="btn" id="next">Next question</button>${canGuess ? `<button class="btn ghost" id="guess">I guessed</button>` : ""}<span class="hint">Enter or Space${canGuess ? " · G if you guessed" : ""}</span></div>`;
  } else {
    h += `<div class="actions"><span class="hint">Press 1–4 or A–D to answer</span></div>`;
  }
  $("main").innerHTML = h;
  $("main").querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => answer(Number(b.dataset.slot))));
  const n = $("next"); if (n) { n.addEventListener("click", nextQ); n.focus({ preventScroll: true }); }
  const gb = $("guess"); if (gb) gb.addEventListener("click", guessed);
}
function renderEmpty() {
  $("main").innerHTML = `<p class="q">No questions match this filter.</p><p class="small">${store.filter === "missed" ? "You have no misses to repeat. Pick a section or All." : "Pick another filter."}</p>`;
  cur = null;
}

// ---- timed mock ----
let exam = null, tick = null;
function startExam() {
  const ids = [];
  Object.entries(X.split).forEach(([sec, n]) => {
    const p = shuffle(BANKX.map((_, i) => i).filter((i) => BANKX[i][0] === Number(sec)));
    p.sort((a, b) => (store.stats[a] ? 1 : 0) - (store.stats[b] ? 1 : 0)); // prefer unseen
    ids.push(...p.slice(0, n));
  });
  exam = { ids: shuffle(ids), perms: ids.map(() => shuffle([0, 1, 2, 3])), picks: ids.map(() => null), i: 0, end: Date.now() + X.minutes * 60000, done: false };
  clearInterval(tick); tick = setInterval(renderTimer, 1000);
  renderExam();
}
function renderTimer() {
  const t = $("timer"); if (!t || !exam || exam.done) return;
  const ms = exam.end - Date.now(), late = ms < 0, a = Math.abs(ms);
  t.textContent = (late ? "+" : "") + Math.floor(a / 60000) + ":" + String(Math.floor(a / 1000) % 60).padStart(2, "0") + (late ? " over" : " left");
  t.classList.toggle("late", late);
}
function renderExam() {
  if (exam.done) return renderResults();
  const n = exam.ids.length, last = n - 1;
  const id = exam.ids[exam.i], q = BANKX[id], p = exam.perms[exam.i], pick = exam.picks[exam.i];
  let h = `<div class="meta"><span class="tag">Question ${exam.i + 1} of ${n}</span><span class="timer" id="timer"></span></div><p class="q">${fmt(q[1])}</p><div class="opts">`;
  p.forEach((oi, slot) => { h += `<button class="opt ${pick === slot ? "sel" : ""}" data-slot="${slot}"><span class="k">${LETTERS[slot]}</span><span>${fmt(q[2][oi])}</span></button>`; });
  h += `</div><div class="actions"><button class="btn ghost" id="prev" ${exam.i === 0 ? "disabled" : ""}>Back</button>`;
  h += exam.i < last ? `<button class="btn" id="fwd">Next</button>` : `<button class="btn" id="submit">Submit exam</button>`;
  h += `<span class="hint">1–4 / A–D to pick · Enter for next · no feedback until you submit</span></div><div class="dots">`;
  exam.ids.forEach((_, k) => { h += `<button class="${exam.picks[k] !== null ? "done" : ""} ${k === exam.i ? "cur" : ""}" data-k="${k}" aria-label="Go to question ${k + 1}">${k + 1}</button>`; });
  h += `</div>`;
  $("main").innerHTML = h; renderTimer();
  $("main").querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => { exam.picks[exam.i] = Number(b.dataset.slot); renderExam(); }));
  $("main").querySelectorAll(".dots button").forEach((b) => b.addEventListener("click", () => { exam.i = Number(b.dataset.k); renderExam(); }));
  const pv = $("prev"); if (pv) pv.addEventListener("click", () => { exam.i--; renderExam(); });
  const fw = $("fwd"); if (fw) fw.addEventListener("click", () => { exam.i++; renderExam(); });
  const sb = $("submit"); if (sb) sb.addEventListener("click", submitExam);
}
function submitExam() {
  exam.done = true; clearInterval(tick);
  exam.ids.forEach((id, k) => {
    const ok = exam.picks[k] !== null && exam.perms[k][exam.picks[k]] === 0, s = stat(id);
    session.answered++;
    if (ok) { s.c++; session.correct++; }
    else { s.w++; store.retry[id] = 2; const e = store.garden[id] || (store.garden[id] = { st: 0, due: 0 }); e.due = Math.min(e.due, store.tick); }
  });
  exam.took = Math.round((Date.now() - (exam.end - X.minutes * 60000)) / 60000);
  save(); renderRail(); renderResults();
}
function renderResults() {
  const n = exam.ids.length;
  let score = 0; const bySec = {};
  exam.ids.forEach((id, k) => { const sec = BANKX[id][0], ok = exam.picks[k] !== null && exam.perms[k][exam.picks[k]] === 0; bySec[sec] = bySec[sec] || [0, 0]; bySec[sec][1]++; if (ok) { score++; bySec[sec][0]++; } });
  let h = `<div class="meta"><span class="tag">Timed ${n} · results</span><span>${exam.took} min</span></div><p class="q">${score} / ${n} (${Math.round(score / n * 100)}%)</p><div class="secs">`;
  Object.keys(bySec).sort((a, b) => a - b).forEach((s) => { const [c, m] = bySec[s], pc = c / m; h += `<div class="sec"><span class="n">S${s}</span><div class="bar" title="${X.sections[s]}"><i class="${pc < .6 ? "lo" : pc < .8 ? "mid" : "hi"}" style="width:${pc * 100}%"></i></div><span class="v">${c}/${m}</span></div>`; });
  h += `</div><p class="small" style="margin-top:12px">Every miss has been added to Drill as a repeat. The mock doesn’t grow or wilt any plants. Switch to Drill and pick “Missed” to work through them.</p><div class="actions"><button class="btn" id="again">New timed mock</button><button class="btn ghost" id="todrill">Drill my misses</button></div><div class="review">`;
  exam.ids.forEach((id, k) => {
    const q = BANKX[id], p = exam.perms[k], pick = exam.picks[k], ok = pick !== null && p[pick] === 0;
    if (ok) return;
    h += `<div class="item"><p><b>Q${k + 1}.</b> ${fmt(q[1])}</p><p class="small">You: ${pick === null ? "no answer" : fmt(q[2][p[pick]])}</p><p><b>Answer:</b> ${fmt(q[2][0])}</p><p class="small">${fmt(q[3])} <a href="${link(q)}" target="_blank" rel="noopener">Docs</a></p></div>`;
  });
  h += `</div>`;
  $("main").innerHTML = h;
  $("again").addEventListener("click", startExam);
  $("todrill").addEventListener("click", () => { store.filter = "missed"; save(); setMode("drill"); });
}

// ---- rail ----
function renderRail() {
  $("k-ans").textContent = session.answered;
  $("k-acc").textContent = session.answered ? Math.round(session.correct / session.answered * 100) + "%" : "–";
  $("k-pace").textContent = session.answered && mode === "drill" ? Math.round(session.time / session.answered / 1000) : "–";
  $("k-due").textContent = Object.values(store.retry).filter((v) => v > 0).length;
  $("k-grew").textContent = session.grew;
  $("k-bloom").textContent = BANKX.filter((_, i) => gst(i) === 5).length;
  let h = "";
  Object.keys(X.sections).forEach((sec) => {
    const ids = BANKX.map((_, i) => i).filter((i) => BANKX[i][0] === Number(sec)), n = ids.length, by = [0, 0, 0, 0, 0, 0];
    ids.forEach((i) => { const st = gst(i); if (st > 0) by[st]++; });
    const tip = `${X.sections[sec]}: ` + [1, 2, 3, 4, 5].map((k) => `${by[k]} ${STAGE[k].toLowerCase()}`).join(", ") + `, ${n - by.slice(1).reduce((a, b) => a + b, 0)} not yet planted`;
    h += `<div class="sec"><span class="n">S${sec}</span><div class="stack" title="${tip}">${[5, 4, 3, 2, 1].map((k) => (by[k] ? `<i class="s${k}" style="width:${by[k] / n * 100}%"></i>` : "")).join("")}</div><span class="v" title="in bloom">${by[5]}/${n}</span></div>`;
  });
  $("secs").innerHTML = h;
  renderChips();
}
function renderChips() {
  const missed = BANKX.map((_, i) => i).filter((i) => store.retry[i] > 0 || (store.stats[i] && store.stats[i].w > 0)).length;
  let h = `<button class="chip" data-f="all" aria-pressed="${store.filter === "all"}">All<span class="w">${BANKX.length}</span></button>`;
  Object.keys(X.sections).forEach((s) => { h += `<button class="chip" data-f="${s}" aria-pressed="${store.filter === s}">S${s} ${X.sections[s]}<span class="w">${X.weight[s]}%</span></button>`; });
  h += `<button class="chip missed" data-f="missed" aria-pressed="${store.filter === "missed"}">Missed<span class="w">${missed}</span></button>`;
  $("chips").innerHTML = h;
  $("chips").hidden = mode !== "drill";
  $("chips").querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { store.filter = b.dataset.f; save(); queue = []; renderChips(); nextQ(); }));
}

// ---- garden view ----
function renderGarden() {
  const by = [0, 0, 0, 0, 0, 0, 0]; // index st+1
  BANKX.forEach((_, i) => by[gst(i) + 1]++);
  let h = `<div class="meta"><span class="tag">Garden</span><span>${by[6]} of ${BANKX.length} in bloom</span></div>`;
  h += `<p class="small" style="margin:0 0 8px">Each question is a plant. A correct answer plants a seed, and correct answers spaced out over time grow it to a bloom at 5. A wrong answer drops it two stages, and a bloom wilts to a sprout. Click any plant to practise that question.</p>`;
  h += `<div class="garden-head">` + [-1, 0, 1, 2, 3, 4, 5].map((st) => `<span>${plant(st)}${st < 0 ? "Not seen" : STAGE[st]} <b>${by[st + 1]}</b></span>`).join("") + `</div>`;
  Object.keys(X.sections).forEach((sec) => {
    const ids = BANKX.map((_, i) => i).filter((i) => BANKX[i][0] === Number(sec)).sort((a, b) => gst(b) - gst(a));
    const bl = ids.filter((i) => gst(i) === 5).length;
    h += `<div class="bed"><h3>S${sec} ${X.sections[sec]} <small>${bl}/${ids.length} in bloom · ${X.weight[sec]}% of exam</small></h3><div class="plot">`;
    ids.forEach((i) => { const t = BANKX[i][1].replace(/`/g, ""); h += `<button data-id="${i}" title="${esc(stageLabel(gst(i)))}: ${esc(t.length > 90 ? t.slice(0, 90) + "…" : t)}" aria-label="${esc(stageLabel(gst(i)))}. Practise this question">${plant(gst(i))}</button>`; });
    h += `</div></div>`;
  });
  $("main").innerHTML = h;
  $("main").querySelectorAll(".plot button").forEach((b) => b.addEventListener("click", () => setMode("drill", Number(b.dataset.id))));
}

// ---- exam & mode switches ----
function setExam(id) {
  if (!EXAMS[id] || !EXAMS[id].bank.length) return;
  examId = id; X = EXAMS[id]; BANKX = X.bank;
  try { localStorage.setItem(KEYS.choice, id); } catch (e) {}
  loadStore();
  session = { answered: 0, correct: 0, time: 0, grew: 0 };
  queue = []; cur = null; lastId = null; exam = null; clearInterval(tick);
  $("exam-assoc").setAttribute("aria-pressed", id === "assoc"); $("exam-pro").setAttribute("aria-pressed", id === "pro");
  $("title").textContent = X.title; document.title = X.title;
  $("bankcount").textContent = BANKX.length + " questions";
  $("mode-exam").textContent = "Timed " + X.total;
  setMode(mode);
}
function setMode(m, id) {
  mode = m;
  ["drill", "exam", "garden"].forEach((k) => $("mode-" + k).setAttribute("aria-pressed", m === k));
  if (m === "drill") { clearInterval(tick); if (id !== undefined) show(id); else nextQ(); }
  else if (m === "garden") { clearInterval(tick); renderGarden(); }
  else if (!exam || exam.done) startExam(); else { tick = setInterval(renderTimer, 1000); renderExam(); }
  renderRail();
}
$("exam-assoc").addEventListener("click", () => setExam("assoc"));
$("exam-pro").addEventListener("click", () => setExam("pro"));
$("mode-drill").addEventListener("click", () => setMode("drill"));
$("mode-exam").addEventListener("click", () => setMode("exam"));
$("mode-garden").addEventListener("click", () => setMode("garden"));
if (!PBANK.length) $("exam-pro").disabled = true;

// ---- keyboard ----
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase(), slot = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (mode === "drill") {
    if (slot >= 0 && picked === null) { e.preventDefault(); answer(slot); }
    else if ((k === "enter" || k === " ") && picked !== null) { e.preventDefault(); nextQ(); }
    else if (k === "g" && picked !== null) { e.preventDefault(); guessed(); }
  } else if (exam && !exam.done) {
    const last = exam.ids.length - 1;
    if (slot >= 0) { exam.picks[exam.i] = slot; renderExam(); }
    else if (k === "enter" && exam.i < last) { e.preventDefault(); exam.i++; renderExam(); }
    else if (k === "arrowleft" && exam.i > 0) { exam.i--; renderExam(); }
    else if (k === "arrowright" && exam.i < last) { exam.i++; renderExam(); }
  }
});

// ---- misses export & reset ----
$("copy").addEventListener("click", () => {
  const rows = BANKX.map((q, i) => [q, i]).filter(([, i]) => store.stats[i] && store.stats[i].w > 0)
    .sort((a, b) => store.stats[b[1]].w - store.stats[a[1]].w)
    .map(([q, i]) => `S${q[0]} | missed ${store.stats[i].w}x, right ${store.stats[i].c}x | ${q[1].replace(/`/g, "")} | Answer: ${q[2][0].replace(/`/g, "")}`);
  const text = rows.length ? `My ${X.title} misses:\n` + rows.join("\n") : "No misses yet.";
  const done = () => { $("copy").textContent = "Copied"; setTimeout(() => ($("copy").textContent = "Copy misses"), 1500); };
  const fallback = () => { $("copyout").innerHTML = `<textarea id="copyfallback" readonly></textarea>`; $("copyfallback").value = text; $("copyfallback").select(); };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
});
$("reset").addEventListener("click", () => {
  $("copyout").innerHTML = `<div class="confirm" style="margin-top:8px"><span>Clear all ${X.title} progress and misses?</span><button class="btn danger" id="yes">Clear</button><button class="btn ghost" id="no">Keep</button></div>`;
  $("yes").addEventListener("click", () => { store = { stats: {}, retry: {}, filter: "all", garden: {}, tick: 0 }; save(); session = { answered: 0, correct: 0, time: 0, grew: 0 }; $("copyout").innerHTML = ""; setMode(mode); });
  $("no").addEventListener("click", () => ($("copyout").innerHTML = ""));
});

setExam(examId);
})();
</script>
